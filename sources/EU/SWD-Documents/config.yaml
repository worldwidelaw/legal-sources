source:
  id: "EU/SWD-Documents"
  name: "European Commission — Staff Working Documents (SWD/SEC)"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every Commission staff working document is stored with a CELEX number
  # of the form 5{YYYY}SC{NNNN} (sector 5 = preparatory acts; "SC" = the
  # SWD/SEC document class: impact assessments, evaluations, fitness checks,
  # executive summaries, and the older SEC series). Enumeration is via the
  # public CELLAR SPARQL endpoint (year-scoped CELEX regex to stay under the
  # ~10K OFFSET ceiling); full text via CELLAR content negotiation — xHTML for
  # recent OJ/Formex bodies, born-digital PDF streams otherwise (PyMuPDF). This
  # bypasses the eur-lex.europa.eu AWS-WAF that 202-challenges datacenter IPs,
  # so it is fleet-safe. Same recipe as EU/COM-Documents, narrowed to "SC".
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Staff Working Documents published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
