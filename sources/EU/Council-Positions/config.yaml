source:
  id: "EU/Council-Positions"
  name: "Council of the EU — Positions at First Reading"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every Council position in the ordinary legislative procedure is stored
  # with a CELEX number of the form 5{YYYY}AG{NNNN} (sector 5 = preparatory acts;
  # "AG" = the Council-position document class: positions at first reading /
  # common positions and their statements of reasons). Enumeration is via the
  # public CELLAR SPARQL endpoint (year-scoped CELEX regex to stay under the
  # ~10K OFFSET ceiling); full text via CELLAR content negotiation — xHTML for
  # OJ/Formex bodies, born-digital PDF streams otherwise (PyMuPDF). The CELEX is
  # URL-encoded because Council-position CELEX numbers carry a parenthesised
  # sub-part suffix (e.g. 52023AG0002(01)). This bypasses the eur-lex.europa.eu
  # AWS-WAF that 202-challenges datacenter IPs, so it is fleet-safe. Same recipe
  # as EU/COM-Documents and EU/SWD-Documents, narrowed to "AG".
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Council positions published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
