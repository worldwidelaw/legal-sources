source:
  id: "EU/ESC-Opinions"
  name: "Economic and Social Committee — Opinions (historical AC series)"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every Economic and Social Committee opinion up to ~2000 is stored with
  # a CELEX number of the form 5{YYYY}AC{NNNN} (sector 5 = preparatory acts;
  # "AC" = the avis CES / ESC-opinion document class). The Committee — the EU's
  # advisory body of employers, workers and civil society, created by the 1957
  # Treaty of Rome and renamed the European Economic and Social Committee (EESC)
  # in 2002 — adopts advisory opinions on Commission proposals and own-initiative
  # topics, published in the OJ C series. This AC series is a distinct, additive
  # companion to EU/EESC-Opinions (the modern "AE" descriptor, effectively empty
  # before 2000). CELLAR holds a digitised full-text body for AC opinions from
  # ~1995 onward; the scraper enumerates 1993-2000 (year-scoped CELEX regex, to
  # stay under the ~10K SPARQL OFFSET ceiling) and keeps only records that
  # resolve to real full text. Full text via CELLAR content negotiation — the OJ
  # HTML manifestation addressed by the language-suffixed CELEX
  # (/resource/celex/{CELEX}.ENG, Accept text/html), with xHTML and born-digital
  # PDF (PyMuPDF) fallbacks. This bypasses the eur-lex.europa.eu AWS-WAF that
  # 202-challenges datacenter IPs, so it is fleet-safe. Same CELLAR recipe as
  # EU/EESC-Opinions, EU/CoR-Opinions and EU/ECB-Opinions, narrowed to "AC".
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "ESC opinions published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
