source:
  id: "EU/InternationalAgreements"
  name: "EU — International Agreements"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every international agreement concluded by the Union is stored with a
  # CELEX number in sector 2 ("external relations"), document class "A" —
  # 2{YYYY}A{NNNN} (e.g. 22026A00186, the EU–Mercosur Partnership Agreement).
  # These are the binding agreements the EU concludes with third countries and
  # international organisations: trade and association agreements, partnership
  # and cooperation agreements, fisheries and air-transport agreements, customs
  # and mutual-assistance agreements, and the conventions of bodies set up by
  # such agreements — a distinct, additive corpus to EU/EUR-Lex (sector-3
  # legislation). Enumeration is via the public CELLAR SPARQL endpoint (the "A"
  # corpus is ~4,400 rows, well under the ~10K OFFSET ceiling); full text via
  # CELLAR content negotiation (Accept application/xhtml+xml, Accept-Language
  # en), which bypasses the eur-lex.europa.eu AWS-WAF that 202-challenges
  # datacenter IPs, so it is fleet-safe. Same recipe as EU/EESC-Opinions.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - legislation

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "EU international agreements published by the Publications Office are reusable, including for commercial purposes, under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
