source:
  id: "EU/CouncilResolutions"
  name: "EU — Council Resolutions"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where the resolutions and declarations of the Council of the EU (Art. 288
  # TFEU non-binding acts) are stored with a CELEX number in sector 3, document
  # class "G" — 3{YYYY}G{NNNN}. Council resolutions express a political commitment
  # or invite action in an area of Union policy (e.g. the EU Work Plan for
  # Culture, the European Education Area, a joint European degree label, strategic
  # frameworks for education and training).
  # A distinct, additive corpus to EU/EUR-Lex, which enumerates sector 3 by the
  # binding resource-types only (REG / DIR / DEC and their implementing/delegated
  # variants) and never pulls Council resolutions. C-series resolutions under the
  # "Y" descriptor (EU/OJC-Acts) are a different set of CELEX works — no _id
  # collision — so "G" is not otherwise captured.
  # Enumeration is via the public CELLAR SPARQL endpoint (the sector-3 G corpus is
  # ~157 rows, far under the OFFSET ceiling, so a single paged sweep suffices).
  # Full text via CELLAR content negotiation: xHTML for modern acts, OJ HTML via
  # the language-suffixed CELEX (.ENG) for older ones, born-digital PDF (PyMuPDF)
  # for the remainder — all of which bypass the eur-lex.europa.eu AWS-WAF that
  # 202-challenges datacenter IPs, so it is fleet-safe. Same recipe as
  # EU/OJC-Acts and EU/CommissionOpinions.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Council resolutions published in the Official Journal by the Publications Office are reusable, including for commercial purposes, under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
