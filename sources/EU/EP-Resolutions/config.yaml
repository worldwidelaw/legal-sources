source:
  id: "EU/EP-Resolutions"
  name: "European Parliament — Non-Legislative Resolutions"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every European Parliament non-legislative resolution is stored with a
  # CELEX number of the form 5{YYYY}IP{NNNN} (sector 5 = preparatory acts; "IP" =
  # the EP-resolution document class, as distinct from "AP" = EP positions at
  # readings within the legislative procedure). These are own-initiative reports
  # and topical/urgency resolutions (human rights, foreign affairs, environment,
  # economy, implementation/monitoring). Enumeration is via the public CELLAR
  # SPARQL endpoint (year-scoped CELEX regex to stay under the ~10K OFFSET
  # ceiling); full text via CELLAR content negotiation — OJ/Formex xHTML for most
  # resolutions, born-digital PDF (PyMuPDF) for older ones. This bypasses the
  # eur-lex.europa.eu AWS-WAF that 202-challenges datacenter IPs, so it is
  # fleet-safe. Same recipe as EU/COM-Documents, EU/SWD-Documents,
  # EU/Council-Positions and EU/EP-Positions, narrowed to "IP".
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "EP resolutions published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
