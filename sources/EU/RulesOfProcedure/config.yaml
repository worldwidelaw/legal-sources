source:
  id: "EU/RulesOfProcedure"
  name: "EU — Rules of Procedure & Institutional Acts"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where the EU's institutional and procedural acts carry a CELEX number in
  # sector 3, document class "Q" — 3{YYYY}Q{NNNN}. The "Q" descriptor gathers the
  # rules of procedure of the EU institutions, courts and bodies (Court of
  # Justice, General Court, European Economic and Social Committee, Committee of
  # the Regions, agency management boards), their amendments, the Union courts'
  # practice directions and practice rules, inter-institutional framework
  # agreements (e.g. the EP–Commission Framework Agreement), codes of conduct,
  # and internal decisions of bodies such as the European Data Protection
  # Supervisor.
  # A distinct, additive corpus to EU/EUR-Lex, which enumerates sector 3 by the
  # ordinary binding resource-types only (REG / DIR / DEC and their
  # implementing/delegated variants) and never pulls the "Q" institutional acts.
  # No _id collision with any other descriptor.
  # Enumeration is via the public CELLAR SPARQL endpoint (the sector-3 Q corpus is
  # ~526 rows, far under the OFFSET ceiling, so a single paged sweep suffices).
  # Full text via CELLAR content negotiation: xHTML for modern acts, OJ HTML via
  # the language-suffixed CELEX (.ENG) for older ones, born-digital PDF (PyMuPDF)
  # for the remainder — all of which bypass the eur-lex.europa.eu AWS-WAF that
  # 202-challenges datacenter IPs, so it is fleet-safe. Some Q CELEX carry a
  # parenthesised sub-part (e.g. 32020Q1012(01)); the CELEX is URL-encoded before
  # content negotiation. Same recipe as EU/FrameworkDecisions and
  # EU/CouncilResolutions.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Rules of procedure and institutional/procedural acts published in the Official Journal by the Publications Office are reusable, including for commercial purposes, under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
