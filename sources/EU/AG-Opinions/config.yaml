source:
  id: "EU/AG-Opinions"
  name: "CJEU — Opinions of the Advocates General"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every Advocate General Opinion is published in the EU case-law
  # collection with a CELEX number of the form 6{YYYY}CC{NNNN} (sector 6 =
  # EU case-law, "CC" = conclusions / Opinion of an Advocate General, YYYY =
  # case-registration year). Enumeration is via the public CELLAR SPARQL
  # endpoint, scoped one case-year at a time (the ~11,000-Opinion corpus
  # exceeds the SPARQL 10,000-row OFFSET ceiling); full text via CELLAR
  # content negotiation (xHTML for modern Opinions, legacy HTML fallback for
  # older ones) which bypasses the eur-lex.europa.eu AWS-WAF that
  # 202-challenges datacenter IPs.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - case_law

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      celex:
        type: string
        required: true
      ecli:
        type: string
        required: false
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "CJEU Advocate General Opinions published in the EU case-law collection are reusable under the Commission's reuse policy (Decision 2011/833/EU)."
