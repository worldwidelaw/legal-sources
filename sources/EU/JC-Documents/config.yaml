source:
  id: "EU/JC-Documents"
  name: "EU Joint Communications & Joint Reports (High Representative + Commission)"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every joint document of the High Representative and the Commission is
  # stored with a CELEX number of the form 5{YYYY}JC{NNNN} (sector 5 =
  # preparatory acts, descriptor JC). Enumeration is via the public CELLAR
  # SPARQL endpoint (the whole JC descriptor is only a few hundred works, so a
  # single un-scoped offset sweep stays well under the ~10K OFFSET ceiling);
  # full text via CELLAR content negotiation — xHTML for older documents,
  # born-digital PDF streams (PyMuPDF) for recent ones. This bypasses the
  # eur-lex.europa.eu AWS-WAF that 202-challenges datacenter IPs, so it is
  # fleet-safe.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Joint Communications published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
