source:
  id: "EU/EP-Decisions"
  name: "European Parliament — Decisions"
  country: "EU"
  language: "en"

  # Full text is retrieved from the EU Publications Office (CELLAR / EUR-Lex),
  # where every European Parliament decision is stored with a CELEX number of the
  # form 5{YYYY}DP{NNNN} (sector 5 = preparatory acts; "DP" = the EP-decision
  # document class). These are the decisions the Parliament adopts in plenary
  # beyond legislative positions (AP) and non-legislative resolutions (IP):
  # appointments/renewals of members of EU bodies, decisions on waiver/defence of
  # a Member's parliamentary immunity, decisions not to object to Commission
  # delegated/implementing acts, discharge and own-resources decisions, etc.
  # (P{n}_TA(YYYY)NNNN texts-adopted identifiers). Enumeration is via the public
  # CELLAR SPARQL endpoint (the DP corpus is well under the ~10K OFFSET ceiling);
  # full text via CELLAR content negotiation (Accept application/xhtml+xml,
  # Accept-Language en), which bypasses the eur-lex.europa.eu AWS-WAF that
  # 202-challenges datacenter IPs, so it is fleet-safe. Distinct + additive
  # companion to EU/EP-Positions, EU/EP-Resolutions and EU/EuroParl (adopted-texts
  # API only 2014+; DP spans 1999-present). Same recipe as EU/EESC-Opinions.
  endpoints:
    sparql: "http://publications.europa.eu/webapi/rdf/sparql"
    cellar_celex: "http://publications.europa.eu/resource/celex/{celex}"

  data_types:
    - doctrine

  rate_limit:
    requests_per_second: 1
    delay_between_requests: 1

  schema:
    key_fields:
      _id:
        type: string
        required: true
      title:
        type: string
        required: true
      text:
        type: string
        required: true
      date:
        type: date
        required: false

fetch:
  sample_count: 15

license:
  name: "EU institutional reuse (Decision 2011/833/EU)"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32011D0833"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "EP decisions published by the Publications Office are reusable under the Commission's reuse policy (Decision 2011/833/EU). Attribution to the source is requested."
