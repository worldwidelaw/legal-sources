# ===================================================================
# MX/PoderJudicialJalisco -- Jalisco State Court Decisions
# ===================================================================
# The Supremo Tribunal de Justicia del Estado de Jalisco publishes
# court decisions (sentencias) via a public REST API. ~88,000 decisions
# across Civil, Mercantil, Familiar, Penal, and Laboral matters.
# Full text comes from the born-digital sentencia PDFs.
# ===================================================================

source:
  id: "MX/PoderJudicialJalisco"
  country: "MX"
  name: "Jalisco State Court Decisions"
  url: "https://publicacionsentencias.stjjalisco.gob.mx/"
  description: |
    Court decisions from the Supremo Tribunal de Justicia del Estado de
    Jalisco. ~88,000 decisions from 11 court chambers (Salas) covering
    Civil, Mercantil, Familiar, Penal, and Laboral matters. Enumerated
    over the toca id space; full text extracted from the sentencia PDFs.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  # The API throttles per route, per minute (Laravel): /toca/{id} ~26/min,
  # /toca/{id}/file 20/min. bootstrap.py enforces those per-route budgets
  # itself; this is the outer per-record limiter.
  requests_per_second: 0.3
  min_rate: 0.1
  max_rate: 0.33
  burst: 2
  max_workers: 4

api:
  type: "rest"
  base_url: "https://publica-sentencias-backend.stjjalisco.gob.mx"
  endpoints:
    metadata: "/toca/{id}"
    pdf: "/toca/{id}/file"
  response_format: "json"
  # /tocas?page=N (the paginated listing) is gated behind reCAPTCHA v3 and
  # answers 403 {"error":"reCAPTCHA requerido"} — do NOT rely on it. The
  # per-document routes above are open. See issue #1374.

data_model:
  type: "case_law"
  primary_key: "_id"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 13
  key_fields:
    - name: "_id"
      description: "Unique decision identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Decision title (toca number, court, subject)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the decision, extracted from the PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Emission date of the decision"
      type: "date"
      role: "temporal_key"
      required: true
    - name: "url"
      description: "URL to the PDF document"
      type: "string"
      role: "reference"
      required: true
  secondary_fields:
    - name: "court"
      description: "Court chamber (Sala) name"
    - name: "judge"
      description: "Presiding magistrate"
    - name: "subject_area"
      description: "Subject area (Civil, Penal, etc.)"
    - name: "case_type"
      description: "Type of proceeding"
    - name: "ruling"
      description: "Ruling direction (confirmar, modificar, etc.)"
    - name: "case_number"
      description: "Toca number and period"
    - name: "publication_date"
      description: "Date of publication"
    - name: "crime_or_action"
      description: "Crime or specific legal action"
