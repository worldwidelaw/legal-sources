  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: US state government edict; not subject to copyright.
fetch:
  rate_limit_delay: 1
  sample_size: 15
rate_limit:
  requests_per_second: 1
  burst: 2
