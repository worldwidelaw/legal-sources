source:
  id: US/CA-WCAB
  name: California Workers' Compensation Appeals Board — En Banc, Significant Panel & Panel Decisions
  country: US
  url: https://www.dir.ca.gov/wcab/
  auth: none
  data_types:
  - case_law
  description: >
    En banc, significant panel and ordinary panel decisions of the California
    Workers' Compensation Appeals Board (~5,790), published as born-digital PDFs
    on the Department of Industrial Relations site. En banc decisions bind all
    workers' compensation judges and the Board itself; significant panel
    decisions are persuasive authority; panel decisions (2021-) are the Board's
    routine appellate output.
license:
