# ===================================================================
# US/AZ-AGOpinions -- Arizona Attorney General Formal Opinions
# ===================================================================
# Full text of formal legal opinions issued by the Arizona Attorney
# General. These are official state legal interpretations (doctrine).
# Published openly as HTML at azag.gov/opinions.
# No authentication required. Public government data.
# ===================================================================

source:
  id: "US/AZ-AGOpinions"
  country: "US"
  name: "Arizona Attorney General Formal Opinions"
  url: "https://www.azag.gov/opinions"
  description: |
    Formal legal opinions issued by the Arizona Office of the Attorney
    General. Each opinion answers a legal question posed by a public
    official and constitutes an authoritative (advisory) state legal
    interpretation. Full text extracted from the official HTML detail
    pages. Online coverage 2011-present (~150 opinions).

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_scraping"
  base_url: "https://www.azag.gov"
  endpoints:
    index: "/opinions?field_date_posted_value={year_index}"
    detail: "/opinions/{slug}"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "full_replace"
  dedup_key:
    - "opinion_number"

schema:
  total_fields: 7
  key_fields:
    - name: "opinion_number"
      description: "Official AG opinion number (e.g., 'I25-009')"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Opinion title (subject of the question presented)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the opinion extracted from the HTML body"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Date the opinion was issued (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: true

license:
  name: "Public Domain (US Government Work — Arizona)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Arizona Attorney General opinions are official state government works in the public domain."

notes: |
  - Formal AG opinions at azag.gov/opinions
  - Drupal exposed-form view filtered by year via
    ?field_date_posted_value=N (1=2025, 2=2024, ... 15=2011). Each year
    lists all its opinions on one page (AZ issues ~5-14/year).
  - Detail pages /opinions/iYY-NNN-rYY-NNN expose title (<h1
    field--name-title>), issued date (<time datetime>), and the full
    opinion body in the Drupal field--name-body region.
  - HTML extraction (a PDF mirror also exists per opinion but the HTML
    body is complete); online coverage 2011-present.
  - Public domain Arizona government data.
