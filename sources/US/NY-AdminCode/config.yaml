# ===================================================================
# US/NY-AdminCode -- New York Codes Rules and Regulations (NYCRR)
# ===================================================================
# Full text of NYCRR sections via Cornell LII.
# 24 titles (1-23 plus Title 99 Executive Orders) covering all state
# agency regulations.
# No authentication required. Self-paced at ~1 req/s; resumable via data/.
# ===================================================================

source:
  id: "US/NY-AdminCode"
  country: "US"
  name: "New York Codes Rules and Regulations (NYCRR)"
  url: "https://www.law.cornell.edu/regulations/new-york"
  description: |
    New York Codes Rules and Regulations with full text of every regulation
    section, fetched from Cornell LII. Covers all 24 active titles.
    Updated quarterly from official DOS data.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  # bootstrap.py paces every request itself (NY_ADMINCODE_CRAWL_GAP, ~1 req/s
  # shared across the section-fetch pool). This must not sit below that, or the
  # adaptive limiter in bootstrap_fast becomes the real bottleneck: at the old
  # 0.1/s the ~30K-section walk needed 83h and never finished (issue #1370).
  requests_per_second: 1.0
  burst: 4
  max_workers: 4

api:
  type: "html_scraping"
  base_url: "https://www.law.cornell.edu"
  endpoints:
    title_list: "/regulations/new-york"
    title_page: "/regulations/new-york/title-{N}"
    section_page: "/regulations/new-york/{TITLE}-NYCRR-{SECTION}"

data_model:
  type: "legislation"
  primary_key: "section_id"
  update_strategy: "full_replace"
  dedup_key:
    - "section_id"

schema:
  total_fields: 12
  key_fields:
    - name: "section_id"
      description: "Unique section identifier (e.g., 'NYCRR-22-202.8')"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Section heading with number and name"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the regulation section"
      type: "string"
      role: "content"
      required: true
    - name: "title_num"
      description: "NYCRR title number"
      type: "string"
      role: "classification"
      required: true
    - name: "date"
      description: "Date fetched (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: true

notes: |
  - 24 active titles, ~30K sections
  - HTML scraping from Cornell LII (law.cornell.edu)
  - Breadth-first hierarchy walk: a part page can list its own sections AND
    link deeper named subdivisions that carry more (title-6/.../part-1 plus
    .../part-1/bear), so sections are collected at every level
  - Resumable: data/enumeration.json caches the per-title section list and
    data/done_sections.txt the sections already written; a run bounded by
    NY_ADMINCODE_MAX_RUNTIME picks up where the last one stopped
  - Official data sourced from NY DOS, updated quarterly
