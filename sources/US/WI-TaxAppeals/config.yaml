# ===================================================================
# US/WI-TaxAppeals -- Wisconsin Tax Appeals Commission
# Rulings & Orders (case_law)
# ===================================================================
# The Wisconsin Tax Appeals Commission is the independent state agency that
# adjudicates all Wisconsin state tax disputes (income/franchise, sales & use,
# and property/manufacturing). Its published Rulings & Orders -- and the
# reviewing Court of Appeals / Circuit Court / Supreme Court opinions filed
# alongside them -- are official public records of the State of Wisconsin.
# Every published document decides a specific case -> case_law.
#
# Discovery is from 26 server-rendered alphabetical index pages (no JS, no
# CAPTCHA, no auth):
#   https://taxappeals.wi.gov/Pages/Decision%20Pages/All/{A..Z}.aspx
# Each page ships direct <a href="/Documents/....pdf"> links; the filename
# encodes the petitioner, docket, decision date (MMDDYY), and authoring body
# (TAC = Commission; CT APP / CIRCUIT / SUPREME = reviewing court).
#
# OCR REQUIRED: the decision PDFs are scanned images with no text layer, so
# full text is extracted via the OCR fallback in common.pdf_extract
# (PyMuPDF/pdf2image -> pytesseract), which needs the `tesseract` binary.
# Public-domain Wisconsin state-government works (government-edicts doctrine).
# ===================================================================

source:
  id: "US/WI-TaxAppeals"
  country: "US"
  name: "Wisconsin Tax Appeals Commission — Decisions"
  url: "https://taxappeals.wi.gov/pages/Decisions/All.aspx"
  description: |
    Published Rulings & Orders of the Wisconsin Tax Appeals Commission (the
    independent agency adjudicating Wisconsin income/franchise, sales & use,
    and property/manufacturing tax disputes = case_law), together with the
    reviewing court opinions filed alongside them. Discovered from the 26
    server-rendered alphabetical index pages; full text read from the scanned
    decision PDFs via OCR. No JavaScript scraping, no CAPTCHA, no auth.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_index"
  base_url: "https://taxappeals.wi.gov"
  endpoints:
    index: "https://taxappeals.wi.gov/Pages/Decision%20Pages/All/{letter}.aspx"
  document_root: "https://taxappeals.wi.gov/Documents/"

data_model:
  type: "case_law"
  primary_key: "slug"
  update_strategy: "full_replace"
  dedup_key:
    - "_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Stable document id (US/WI-TaxAppeals/{slug})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "docket_number"
      description: "Docket parsed from the filename (e.g. '20.I.188', '07.T.141')"
      type: "string"
      role: "identifier"
      required: false
    - name: "title"
      description: "Document title (petitioner + docket from the filename)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the decision, OCR-extracted from the scanned PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Decision date (ISO 8601) parsed from the MMDDYY filename token"
      type: "date"
      role: "temporal_key"
      required: false

license:
  name: "Public Domain (US Government Work — Wisconsin state tax adjudications)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Rulings & Orders of the Wisconsin Tax Appeals Commission and the reviewing Wisconsin courts are official state-government works in the public domain under the government-edicts doctrine."

notes: |
  - Discovery iterates the 26 alphabetical index pages (A..Z) and collects
    every /Documents/*.pdf link; the filename supplies the title, docket,
    decision date (MMDDYY token), and authoring body (TAC vs CT APP/CIRCUIT/
    SUPREME).
  - _type is case_law for all documents (Commission rulings and the reviewing
    court opinions filed alongside them).
  - CAVEAT — OCR REQUIRED: the decision PDFs are scanned images (0 text layer);
    full text is extracted via the OCR fallback in common.pdf_extract, which is
    gated on the `tesseract` binary. Launch on a vantage with tesseract; budget
    for OCR slowness across the multi-thousand-decision corpus (consider
    per-letter/era partitioning to fit a fleet slot). A <200-char guard skips
    any PDF that still yields no text.
