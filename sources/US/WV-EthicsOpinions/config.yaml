# ===================================================================
# US/WV-EthicsOpinions -- West Virginia Ethics Commission
# Advisory Opinions
# ===================================================================
# The advisory opinions of the West Virginia Ethics Commission construing
# the WV Governmental Ethics Act (W. Va. Code Ch. 6B), the Open Governmental
# Meetings Act (Ch. 6 art. 9A) and the codes of conduct it oversees. Each is
# the Commission's authoritative written interpretation of those statutes,
# adopted and published with the requester's identity confidential =
# doctrine. Born-digital PDFs (clean text layer), enumerated from the Drupal
# per-year AO pages plus the three single-page series (OMAO/ALJAO/SBAO).
# ===================================================================

source:
  id: "US/WV-EthicsOpinions"
  country: "US"
  name: "West Virginia Ethics Commission — Advisory Opinions"
  url: "https://ethics.wv.gov/advisory-opinion-information"
  description: |
    The advisory opinions of the West Virginia Ethics Commission, the
    independent state body created in 1989 that administers the West Virginia
    Governmental Ethics Act (W. Va. Code Chapter 6B), the Open Governmental
    Meetings Act (Chapter 6, Article 9A) and the several codes of conduct it
    oversees. The Commission publishes four series, all doctrine: Ethics Act
    Advisory Opinions ("AO YYYY-NN"), Open Governmental Meetings Advisory
    Opinions ("OMAO YYYY-NN"), Administrative Law Judge Advisory Opinions
    ("ALJAO YYYY-NN") and School Board Advisory Opinions ("SBAO YYYY-NN").
    Each opinion is the Commission's written interpretation of the relevant
    statute, issued on request and published with the requester's identity
    kept confidential. Served as born-digital PDFs.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 1

api:
  type: "html_listing"
  base_url: "https://ethics.wv.gov"
  endpoints:
    ao_index: "/opinions-and-exemptions/information-opinions/advisory-opinions-ao-1989-present"
    ao_year: "/{YYYY}-advisory-opinions-ao"
    document: "/media/{id}/download?inline"

data_model:
  type: "doctrine"
  primary_key: "_id"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 12
  key_fields:
    - name: "_id"
      description: "Stable document id (US/WV-EthicsOpinions/{opinion number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Opinion number (e.g. 'AO 2022-19', 'OMAO 2025-01')"
      type: "string"
      role: "identifier"
      required: true
    - name: "document_type"
      description: "Ethics Act | Open Governmental Meetings | Administrative Law Judge | School Board Advisory Opinion"
      type: "string"
      role: "metadata"
      required: false
    - name: "subject"
      description: "Short subject/requester role from the listing caption"
      type: "string"
      role: "metadata"
      required: false
    - name: "title"
      description: "Document type + opinion number + subject"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the advisory opinion (born-digital PDF text layer)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Issue date (ISO 8601); parsed from the PDF body, falls back to Jan 1 of the number's year"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "issuer"
      description: "Issuing body (West Virginia Ethics Commission)"
      type: "string"
      role: "metadata"
      required: false
    - name: "jurisdiction"
      description: "ISO 3166-2 subdivision (US-WV)"
      type: "string"
      role: "metadata"
      required: false

license:
  name: "Public Domain (West Virginia state government edict / public record)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Advisory opinions of the West Virginia Ethics Commission are official public records of a West Virginia state agency interpreting statute (government-edict works), adopted by the Commission and published for public use under the WV Governmental Ethics Act (W. Va. Code Ch. 6B)."

notes: |
  - Index: ethics.wv.gov is Drupal (no JS/CAPTCHA/auth). Ethics Act opinions
    are on one page per year, /{YYYY}-advisory-opinions-ao, discovered from the
    master index /opinions-and-exemptions/information-opinions/advisory-opinions-ao-1989-present.
    The OMAO, ALJAO and SBAO series each live on a single listing page.
  - On every page each opinion is an <a> whose text begins with the opinion
    number ("AO 2022-19") and whose href is the born-digital PDF
    /media/{id}/download?inline. Dedup is by opinion number.
  - Full text: born-digital PDF text layer via common.pdf_extract
    (opendataloader -> pdfplumber -> pypdf -> OCR fallback). The <200-char
    guard skips any unreadable scan. The letterhead first page is mostly blank
    whitespace; the opinion body starts on the following pages.
  - Year carried in the opinion number; issue date parsed from the first
    "Month DD, YYYY" in the body (opinions open "Issued on ..."), falling back
    to Jan 1 of that year.
