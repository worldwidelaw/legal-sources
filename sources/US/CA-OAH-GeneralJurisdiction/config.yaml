# ===================================================================
# US/CA-OAH-GeneralJurisdiction -- California Office of Administrative
#   Hearings — General Jurisdiction Division — Decisions
# ===================================================================
# Decisions issued by Administrative Law Judges of the California Office
# of Administrative Hearings (OAH), General Jurisdiction Division. OAH is
# California's central, independent administrative tribunal; its General
# Jurisdiction Division adjudicates contested cases for ~1,500 state and
# local agencies under the Administrative Procedure Act (Gov. Code
# Sec. 11500 et seq.) — professional-license discipline, agency
# enforcement, public-benefit and other administrative disputes. Each
# Decision resolves a specific contested case = case_law. The decision
# library is a Sitecore media folder browsed at dgs.ca.gov/OAH/.../
# Decisions and paginated by a public MediaSearch API that returns
# server-rendered HTML fragments; each decision is a born-digital
# text-layer PDF at /-/media/{guid}.pdf. No CAPTCHA, no auth. Public
# domain California state government works (government edicts).
# DISTINCT from the sibling US/CA-OAH-SpecialEd (special-education
# due-process decisions on the same MediaSearch host).
# ===================================================================

source:
  id: "US/CA-OAH-GeneralJurisdiction"
  country: "US"
  name: "California Office of Administrative Hearings — General Jurisdiction Decisions"
  url: "https://www.dgs.ca.gov/OAH/Case-Types/General-Jurisdiction/Services/Decisions"
  description: |
    General Jurisdiction Decisions of the California Office of
    Administrative Hearings (OAH), General Jurisdiction Division. OAH is
    California's central independent administrative tribunal; its General
    Jurisdiction Division adjudicates contested cases for ~1,500 state and
    local agencies under the Administrative Procedure Act (Gov. Code
    Sec. 11500 et seq.) — license discipline, agency enforcement,
    public-benefit and other administrative disputes — and an ALJ issues a
    Decision resolving each contested case = case_law. Enumerated from the
    Sitecore MediaSearch API (server-rendered HTML fragments, 10
    results/page); discovery keeps only rows bearing a numeric OAH case
    number and dedupes by case number (dropping "Notice of Collection"
    privacy forms, "Quarterly Data Report" statistics and the
    Accessibility-Modified duplicate copies that share the folder) → born-
    digital text-layer PDFs at /-/media/{guid}.pdf, extracted via
    common.pdf_extract. No CAPTCHA, no auth. ~5,344 media items indexed.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_index"
  base_url: "https://www.dgs.ca.gov"
  endpoints:
    search: "/api/sitecore/MediaSearch/GetSearchResults?page={page}&folderPath={folder}&sortBy=date_desc"
    document: "/-/media/{guid}.pdf"

data_model:
  type: "case_law"
  primary_key: "guid"
  update_strategy: "full_replace"
  dedup_key:
    - "_id"

schema:
  total_fields: 13
  key_fields:
    - name: "_id"
      description: "Stable document id (US/CA-OAH-GeneralJurisdiction/{media-guid})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "case_number"
      description: "OAH case number (e.g. '2025050862'); first of case_numbers"
      type: "string"
      role: "identifier"
      required: false
    - name: "parties"
      description: "Caption parties ('X v. Y') or 'In the Matter of ...' matter caption"
      type: "string"
      role: "identifier"
      required: false
    - name: "title"
      description: "Document title (OAH case number + parties)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the OAH General Jurisdiction Decision (PDF text layer)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Decision date (ISO 8601), parsed from the body; falls back to listing Document Date"
      type: "date"
      role: "temporal_key"
      required: false

license:
  name: "Public Domain (US Government Work — California state administrative decisions)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Decisions of the California Office of Administrative Hearings are official state-government works in the public domain under the government-edicts doctrine."

notes: |
  - Enumeration: the decision list is paginated client-side by a Sitecore
    MediaSearch API. The on-page pagination links use the
    /sitecore/shell/api/sitecore/MediaSearch/GetSearchResults prefix,
    which IIS 401-blocks for external clients; the equivalent public
    /api/sitecore/MediaSearch/GetSearchResults prefix returns the same
    HTML fragment and is used here (requires the X-Requested-With:
    XMLHttpRequest header + a Referer). folderPath =
    "/sitecore/media library/Divisions/OAH/General Jurisdiction/GJ Decisions".
  - ~5,344 media items, 10 per page. The folder mixes real decisions with
    multilingual "Notice of Collection" privacy forms and "Quarterly Data
    Report" statistics (no case number) plus Accessibility-Modified/"084"
    remediated duplicate copies. Discovery keeps ONLY rows with a numeric
    OAH case number and dedupes by case number → one Decision per case.
  - A zero-row page is retried up to 3x (transient empty fragments occur)
    before the crawl stops, so no page of real decisions is silently
    dropped.
  - Each result row exposes the PDF url, a result-title with the OAH case
    number(s), and a listing "Document Date". Documents are born-digital
    text-layer PDFs; text is extracted via common.pdf_extract (no OCR).
    A <200-char guard skips any empty/non-PDF response.
  - date prefers the first real "Month D, YYYY" in the decision body
    (typically the cover decision date), falling back to the listing
    Document Date.
  - Sibling: US/CA-OAH-SpecialEd (special-education decisions) uses the
    same MediaSearch mechanism on a different folder. The DDS (Lanterman
    Act) decisions folder is a further easy extension.
  - Public domain California state government data.
