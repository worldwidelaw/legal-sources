# ===================================================================
# US/WI-LegalEthics -- State Bar of Wisconsin — Professional Ethics Opinions
# ===================================================================
# Ethics opinions of the State Bar of Wisconsin's Standing Committee on
# Professional Ethics, each the Committee's written interpretation of
# the Wisconsin Supreme Court Rules of Professional Conduct for
# Attorneys (SCR ch. 20) advising LAWYERS = doctrine (advisory). ~411
# documents across several historical series: E-/EF- (Formal), EI-/IE-/
# I- (Informal), M-/Memo/EM- (Memorandum opinions), spanning the 1950s
# to present. Published free as born-digital PDFs in a public SharePoint
# document library on wisbar.org. Distinct from US/WI-EthicsOpinions
# (executive Wisconsin Ethics Commission — public officials / campaign
# finance) and US/WI-Courts / US/WI-Legislation. The State Bar of
# Wisconsin is the state's integrated (mandatory) bar.
# ===================================================================

source:
  id: "US/WI-LegalEthics"
  country: "US"
  name: "State Bar of Wisconsin — Professional Ethics Opinions"
  url: "https://www.wisbar.org/formembers/ethics/Pages/Ethics-Opinions.aspx"
  description: |
    Ethics opinions issued by the State Bar of Wisconsin's Standing
    Committee on Professional Ethics. Each opinion is the Committee's
    written interpretation of the Wisconsin Supreme Court Rules of
    Professional Conduct for Attorneys (SCR ch. 20). The published corpus
    (~411 documents) spans several historical series — E-/EF- (Formal),
    EI-/IE-/I- (Informal), M-/Memo/EM- (Memorandum opinions) — from the
    1950s to present, each a born-digital PDF carrying the opinion code,
    title, cited SCR rules and full discussion.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 2

api:
  type: "sharepoint_rest_pdf"
  base_url: "https://www.wisbar.org"
  endpoints:
    files: "/formembers/ethics/_api/web/GetFolderByServerRelativeUrl('/formembers/ethics/Ethics Opinions')/Files?$top=3000"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Stable document id (US/WI-LegalEthics/{opinion_number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Opinion code parsed from the filename (e.g. E-00-01, EF-16-03, EI-11-01, M-8-75, MEMO-3-73)"
      type: "string"
      role: "identifier"
      required: true
    - name: "title"
      description: "Opinion title (from the PDF's leading title line; falls back to the filename)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full opinion text from the born-digital PDF (PyMuPDF, no OCR)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "ISO 8601; WI opinions are dated by year (encoded in the code) -> YYYY-01-01"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "issuer"
      description: "State Bar of Wisconsin — Standing Committee on Professional Ethics"
      type: "string"
      role: "metadata"
      required: false
    - name: "jurisdiction"
      description: "ISO 3166-2 sub-jurisdiction code (US-WI)"
      type: "string"
      role: "metadata"
      required: false

license:
  name: "Public Domain / freely published advisory opinions"
  url: "https://www.wisbar.org/formembers/ethics/Pages/Ethics-Opinions.aspx"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "State Bar of Wisconsin professional ethics opinions are published free to the public on wisbar.org (anonymous SharePoint document library) as interpretations of the Wisconsin SCR ch. 20 Rules of Professional Conduct. They are advisory and carry no login, paywall or terms prohibiting reuse. Treated as effectively public domain, consistent with the other state-bar legal-ethics sources. The State Bar of Wisconsin is the state's integrated (mandatory) bar, so the 17 U.S.C. § 105 government-edicts rationale applies directly. Commercial use permitted."

notes: |
  - Discovery: opinions live in a public SharePoint document library on
    wisbar.org (folder "/formembers/ethics/Ethics Opinions"). The web
    page /formembers/ethics/Pages/Ethics-Opinions.aspx renders only the
    first 30 rows client-side, but the full folder is enumerated
    anonymously via the SharePoint REST API
    GetFolderByServerRelativeUrl('/formembers/ethics/Ethics Opinions')/
    Files?$top=3000 — ~415 PDFs, ~411 unique opinion codes.
  - Number: parsed from the filename. Codes take the form
    {series}-{a}-{b} where series ∈ {E, EF, EI, IE, EM, M, I} plus the
    "Memo N-YY" variant. A standalone trailing letter (e.g. "M-8-75 C")
    is preserved as a suffix to avoid collapsing distinct revised
    opinions.
  - Full text: each PDF is born-digital (text layer) → PyMuPDF/fitz
    get_text, NO OCR. Title taken from the PDF's leading
    "Wisconsin (Formal) Ethics Opinion {code}: {title}" line; falls back
    to the filename.
  - Date: WI ethics opinions are dated by year, encoded in the code.
    Year-first series (E/EF/EI/IE) take the first number as the 2-digit
    year; year-last series (M/EM/I/Memo) take the last number. 2-digit
    year YY<=25 => 20YY else 19YY. date => YYYY-01-01. Body text is NOT
    scanned for dates (it carries cited dates from other opinions).
  - Type: every document is the Committee's advisory interpretation of
    the Wisconsin Rules of Professional Conduct = doctrine.
  - Distinct from US/WI-EthicsOpinions (executive Wisconsin Ethics
    Commission — public officials / campaign finance), US/WI-Courts and
    US/WI-Legislation. This is the attorney professional-conduct opinion
    series (lawyers).
