# ===================================================================
# US/OR-MultnomahPresidingJudgeOrders -- Multnomah County Circuit
#                                        Court Presiding Judge Orders
# ===================================================================
# Presiding Judge Orders (PJO) of the Multnomah County Circuit Court,
# Oregon's largest trial court. Under ORS 1.171 the presiding judge of
# a judicial district administers the district and issues standing
# orders that establish binding court policy and procedure -- traffic
# and parking citation processing, animal-control citation handling,
# records access / retention, departmental case assignment, financial
# and fee matters, interpreter procedures, signature-stamp authority,
# and related administrative rules. As the local administrative /
# regulatory-rule instruments of the court they are classed as
# legislation (which includes regulations). Public domain Oregon
# state-government works (government edicts).
#
# Published as a CONTENTdm digital collection (alias p17027coll15,
# "Multnomah Presiding Judge Orders") on the OCLC-hosted instance at
# cdm17027.contentdm.oclc.org. The public dmwebservices JSON API is
# used: dmQuery enumerates item pointers, dmGetItemInfo returns each
# item's Dublin-Core fields including the full-text "transc"
# (Transcript) field. No PDF extraction, no CAPTCHA, no auth.
# ===================================================================

source:
  id: "US/OR-MultnomahPresidingJudgeOrders"
  country: "US"
  name: "Multnomah County Circuit Court — Presiding Judge Orders"
  url: "https://cdm17027.contentdm.oclc.org/digital/collection/p17027coll15"
  description: |
    Presiding Judge Orders (PJO) of the Multnomah County Circuit
    Court, Oregon's largest trial court. Under ORS 1.171 the presiding
    judge administers the judicial district and issues standing orders
    that establish binding court policy and procedure -- traffic and
    parking citation processing, animal-control citation handling,
    records access and retention, departmental case assignment,
    financial / fee matters, interpreter procedures, signature-stamp
    authority, and related administrative rules. As the local
    administrative / regulatory-rule instruments of the court they are
    classed as legislation. Enumerated from the Oregon Judicial
    Department's CONTENTdm collection (alias p17027coll15) via the
    public dmwebservices JSON API; order number, subject, description,
    county, date signed, effective / expiration dates, and the full
    order text are read from each item's Dublin-Core fields (title /
    subjec / descri / publis / date / type / format / transc). No
    CAPTCHA, no auth. ~753 orders, 1995–present.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 2
  burst: 3

api:
  type: "json_api"
  base_url: "https://cdm17027.contentdm.oclc.org"
  endpoints:
    query: "/digital/bl/dmwebservices/index.php?q=dmQuery/p17027coll15/0/dmrecord!date/dmrecord/{max}/{start}/0/0/0/0/json"
    item: "/digital/bl/dmwebservices/index.php?q=dmGetItemInfo/p17027coll15/{rec}/json"

data_model:
  type: "legislation"
  primary_key: "record_id"

schema:
  total_fields: 16
  key_fields:
    - name: "_id"
      description: "Stable id (US/OR-MultnomahPresidingJudgeOrders/{CONTENTdm dmrecord})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "order_number"
      description: "Order number (null when the source marks it 'No number')"
      type: "string"
      role: "identifier"
      required: false
    - name: "subject"
      description: "Subject keyword (e.g. 'Traffic', 'Records', 'Departmental Assignment')"
      type: "string"
      role: "metadata"
      required: false
    - name: "description"
      description: "Description of what the order does"
      type: "string"
      role: "metadata"
      required: false
    - name: "county"
      description: "County (Multnomah)"
      type: "string"
      role: "metadata"
      required: false
    - name: "title"
      description: "Order title (court + order number and/or subject)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the order (CONTENTdm transcript field)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Date signed (ISO 8601), from the CONTENTdm date field"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "effective_date"
      description: "Effective date (ISO 8601), from the CONTENTdm type field"
      type: "date"
      role: "metadata"
      required: false
    - name: "expiration_date"
      description: "Expiration date (ISO 8601), from the CONTENTdm format field"
      type: "date"
      role: "metadata"
      required: false
    - name: "url"
      description: "Link to the CONTENTdm item page"
      type: "string"
      role: "reference"
      required: true

license:
  name: "Public Domain (U.S. state government edict)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Presiding Judge Orders of the Multnomah County Circuit Court are
    official works of Oregon state government (edicts of government)
    and are not subject to copyright. Free to use, including
    commercially.
