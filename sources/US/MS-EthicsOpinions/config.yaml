# ===================================================================
# US/MS-EthicsOpinions -- Mississippi Ethics Commission
# Ethics Advisory Opinions
# ===================================================================
# The ethics advisory opinions of the Mississippi Ethics Commission
# construing the Ethics in Government Law (Miss. Code Ann. Title 25,
# Chapter 4) and Section 109 of the Mississippi Constitution of 1890.
# Each is the Commission's authoritative written interpretation of those
# provisions = doctrine. Born-digital PDFs (clean text layer), enumerated
# from the Commission's public server-side DataTable JSON endpoint.
# ===================================================================

source:
  id: "US/MS-EthicsOpinions"
  country: "US"
  name: "Mississippi Ethics Commission — Ethics Advisory Opinions"
  url: "https://www.ms.gov/msec/ethics/opinion"
  description: |
    The ethics advisory opinions of the Mississippi Ethics Commission, the
    independent state body that administers the Ethics in Government Law
    (Miss. Code Ann. Title 25, Chapter 4) and Section 109 of the Mississippi
    Constitution of 1890. On request, the Commission issues a written opinion
    interpreting those provisions as they apply to a public servant's conduct;
    the opinion is published with the requester's identity edited out and is
    doctrine. ~1,542 opinions (numbered "YY-NNN-E", 2006–present). Served as
    born-digital PDFs.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 1

api:
  type: "json_datatable"
  base_url: "https://www.ms.gov/msec/ethics"
  endpoints:
    list: "/api/opinion/list?draw=1&start=0&length=5000"
    details: "/opinion/details/{id}"
    document: "/Opinion/Document/{file}.pdf"

data_model:
  type: "doctrine"
  primary_key: "_id"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 13
  key_fields:
    - name: "_id"
      description: "Stable document id (US/MS-EthicsOpinions/{opinion number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Opinion number (e.g. '26-011-E', '25-036-ER')"
      type: "string"
      role: "identifier"
      required: true
    - name: "document_type"
      description: "Ethics Advisory Opinion"
      type: "string"
      role: "metadata"
      required: false
    - name: "title"
      description: "Ethics Advisory Opinion No. {number}"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the advisory opinion (born-digital PDF text layer)"
      type: "string"
      role: "content"
      required: true
    - name: "summary"
      description: "Commission-authored summary from the opinion index"
      type: "string"
      role: "content"
      required: false
    - name: "subjects"
      description: "Subject-classification tags from the opinion index"
      type: "string"
      role: "metadata"
      required: false
    - name: "date"
      description: "Issue date (ISO 8601); parsed from the PDF body, falls back to Jan 1 of the number's year"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "issuer"
      description: "Issuing body (Mississippi Ethics Commission)"
      type: "string"
      role: "metadata"
      required: false
    - name: "jurisdiction"
      description: "ISO 3166-2 subdivision (US-MS)"
      type: "string"
      role: "metadata"
      required: false

license:
  name: "Public Domain (Mississippi state government edict / public record)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Ethics advisory opinions of the Mississippi Ethics Commission are official public records of a Mississippi state agency interpreting statute and the state constitution (government-edict works), published for public use under the Ethics in Government Law (Miss. Code Ann. Title 25, Chapter 4)."

notes: |
  - Index: the Commission's opinion search (www.ms.gov/msec/ethics/opinion) is a
    server-side DataTable backed by a public JSON endpoint
    /msec/ethics/api/opinion/list?draw=1&start=0&length=5000 returning every
    opinion as {id, documentId, number, summary, subjectTitleList}.
  - Full text: each opinion's detail page /msec/ethics/opinion/details/{id}
    links to the born-digital PDF at /msec/ethics/Opinion/Document/{file}.pdf.
    The PDF filename is derived irregularly from the opinion number (the "-E"
    suffix is dropped, "-ER"/other suffixes are kept), so the scraper reads the
    actual href from the detail page rather than guessing.
  - Text via common.pdf_extract (opendataloader -> pdfplumber -> pypdf -> OCR
    fallback); the <200-char guard skips any unreadable scan.
  - Issue date parsed from the first "Month DD, YYYY" in the body (which follows
    the "ETHICS ADVISORY OPINION NO. ..." header), falling back to Jan 1 of the
    two-digit year in the opinion number.
  - No CAPTCHA, no auth; a browser User-Agent + Referer is sent. gzip responses.
