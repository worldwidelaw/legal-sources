source:
  id: US/OR-WCB
  name: Oregon Workers' Compensation Board — Board Orders
  country: US
  url: https://www.oregon.gov/wcb/board-orders/Pages/index.aspx
  auth: none
  data_types:
  - case_law
  description: >
    Orders of the Oregon Workers' Compensation Board (ORS chapter 656), which
    reviews Administrative Law Judge orders in Oregon workers' compensation
    claims: Orders on Review, Orders on Reconsideration and Remand, Own Motion
    orders, Claim Disposition Agreement orders, Third Party Distribution orders
    miscellaneous orders, and Crime Victim and OSHA contested-case orders.
    ~29,000 orders from 1996 to the present, published in the Van Natta reporter
    and served as born-digital PDFs (legacy years as HTML) under
    /wcb/Orders/{year}/{type}/{month}/{case}. The site exposes no directory
    listing and the SharePoint SOAP endpoint answers anonymous callers 401 NTLM,
    but the REST endpoint on the same list --
    /wcb/_api/web/lists/getbytitle('Orders')/items -- is anonymous-readable and
    is the authoritative index (FileRef plus claimant, case number, issue date,
    order type and Van Natta citation). Crawled in WCBYear partitions with a
    completed-year checkpoint.
