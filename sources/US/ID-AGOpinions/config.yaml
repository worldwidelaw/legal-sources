# ===================================================================
# US/ID-AGOpinions -- Idaho Attorney General Opinions
# ===================================================================
# Full text of formal opinions issued by the Idaho Attorney General.
# These are official state legal interpretations (doctrine). Published
# openly as text-layer PDFs in the ag.idaho.gov WordPress media library
# and discoverable via the WordPress REST API. No authentication
# required. Public domain US state government works.
# ===================================================================

source:
  id: "US/ID-AGOpinions"
  country: "US"
  name: "Idaho Attorney General Opinions"
  url: "https://www.ag.idaho.gov/office-resources/opinions/"
  description: |
    Formal opinions issued by the Idaho Attorney General. Each opinion
    answers a legal question posed by a public official (legislator,
    agency, or state official) and constitutes an authoritative
    interpretation of Idaho law. Published as text-layer PDFs in the
    ag.idaho.gov media library; the scraper enumerates them via the
    WordPress REST API (/wp-json/wp/v2/media) filtered to the formal
    opinion naming pattern (Opinion YY-N).

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "rest_json"
  base_url: "https://www.ag.idaho.gov"
  endpoints:
    media: "/wp-json/wp/v2/media?search=opinion&per_page=100&page={page}"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "full_replace"
  dedup_key:
    - "opinion_number"

schema:
  total_fields: 8
  key_fields:
    - name: "opinion_number"
      description: "AG opinion number (e.g., '21-1', '09-1') or document slug"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Opinion title (Idaho Attorney General Opinion No. ...)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the opinion extracted from the PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Issue year of the opinion (ISO 8601, derived from number)"
      type: "date"
      role: "temporal_key"
      required: false

license:
  name: "Public Domain (US Government Work — Idaho)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Idaho Attorney General opinions are official state government works in the public domain."

notes: |
  - Formal AG opinions at ag.idaho.gov, published as text-layer PDFs in
    the WordPress media library.
  - The public /office-resources/opinions/ listing is JavaScript-rendered,
    so the scraper instead queries the WordPress REST API media endpoint
    (/wp-json/wp/v2/media?search=opinion) — clean JSON, no JS, no CAPTCHA.
  - Keeps PDFs whose filename matches the formal opinion pattern
    (Opinion YY-N) plus the "Published-Opinion" series; opinion number and
    issue year are derived from the filename.
  - Each opinion is a text-layer PDF (real text, no OCR needed), extracted
    via common.pdf_extract. A few older scanned opinions yield 0 chars
    locally (OCR/tesseract disabled) and are skipped.
  - The host occasionally serves an expired/flaky TLS cert to python
    requests; the scraper paces at ~1 req/s and tolerates transient skips.
  - Coverage ~2005-present (~25 formal opinions); public domain Idaho gov data.
