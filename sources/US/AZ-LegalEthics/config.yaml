# ===================================================================
# US/AZ-LegalEthics -- State Bar of Arizona
#                      — Legal (Attorney) Ethics Opinions
# ===================================================================
# Formal Ethics Opinions of the State Bar of Arizona's Committee on the
# Rules of Professional Conduct (1985-2016) and the most recent opinions
# of the Arizona Supreme Court Attorney Ethics Advisory Committee, all
# indexed together. Each opinion interprets the Arizona Rules of
# Professional Conduct (Ethical Rules, "ER ...") and advises lawyers on
# their professional-responsibility obligations = doctrine. Born-digital
# HTML full text via a public JSON API (no OCR, no CAPTCHA, no per-user
# auth). Public-domain Arizona regulatory-agency records. Distinct from
# US/AZ-* court/legislation sources.
# ===================================================================

source:
  id: "US/AZ-LegalEthics"
  country: "US"
  name: "State Bar of Arizona — Legal (Attorney) Ethics Opinions"
  url: "https://www.azbar.org/for-legal-professionals/ethics/ethics-opinions/"
  description: |
    Formal Ethics Opinions issued by the State Bar of Arizona's (former)
    Committee on the Rules of Professional Conduct, and the most recent
    opinions of the Arizona Supreme Court Attorney Ethics Advisory
    Committee, interpreting the Arizona Rules of Professional Conduct.
    Each opinion answers a specific inquiry about a lawyer's ethical
    obligations. The corpus spans 1985 to present and is served as
    born-digital HTML through a public JSON API; the full opinion body
    is extracted directly from the API response.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 2

api:
  type: "json_api"
  base_url: "https://api.azbar.org"
  endpoints:
    by_year: "/EthicsRules/OpinionSearch/ByYear/?Year={year}"
    opinion: "/EthicsRules/Opinion/?Id={id}"
  auth_note: >
    Every request carries a static, PUBLIC credential trio embedded in
    the listing page's inline JavaScript (userid=publictools, a fixed
    password GUID, updatedBy=Hub). Read live from the page with a
    hard-coded fallback. This is not per-user authentication — it is a
    fixed public key shipped to every visitor.

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 11
  key_fields:
    - name: "_id"
      description: "Stable document id (US/AZ-LegalEthics/{slug of opinion_number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Opinion number (e.g. '15-01', '20-0008')"
      type: "string"
      role: "identifier"
      required: true
    - name: "title"
      description: "Opinion title (number + topic headnote)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the opinion body (Facts / analysis / ER citations + footnotes), from the API Body field; Note appended if present"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Opinion date (ISO 8601), from the API OpinionDate field"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "summary"
      description: "Official headnote/summary of the opinion (from the API Summary field)"
      type: "string"
      role: "metadata"
      required: false

license:
  name: "Public Domain (Arizona Regulatory-Agency Official Record)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Formal ethics opinions of the State Bar of Arizona / Arizona Supreme Court committees are official public records published for public use with no copyright restriction. The opinions themselves state they are advisory and non-binding."

notes: |
  - Discovery: enumerate opinions year-by-year via the public JSON API
    GET https://api.azbar.org/EthicsRules/OpinionSearch/ByYear/?Year={YYYY}
    -> {"Result": [{Id, OpinionNumber, Title, OpinionDate, Summary}, ...]}.
    Years ~1985-2016 (State Bar committee) plus a handful of newer
    (Supreme Court Attorney Ethics Advisory Committee, indexed together).
  - Full text: GET /EthicsRules/Opinion/?Id={id} -> Result.Body holds the
    full opinion HTML (Facts, analysis, ER citations, footnotes); it is
    de-tagged to clean text. Result.Note (if any) is appended.
  - Auth: the API requires a static public credential trio
    (userid=publictools, fixed password GUID, updatedBy=Hub) that the
    ethics-opinions page ships in plain JavaScript to every visitor. The
    scraper reads it live from the page with a hard-coded fallback.
    This is NOT per-user/login auth.
  - Type: every document is a formal ethics opinion interpreting the
    Rules of Professional Conduct = doctrine.
  - Second source in the state-bar attorney-legal-ethics doctrine vein
    after US/NC-LegalEthics; distinct from JudicialEthics (advises
    judges) and executive state-ethics commissions.
