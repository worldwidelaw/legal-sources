schema:
  key_fields:
    - name: "_id"
      type: "string"
      required: true
    - name: "text"
      type: "string"
      required: true
    - name: "title"
      type: "string"
      required: true
    - name: "document_type"
      type: "string"
      required: false
    - name: "title_number"
      type: "integer"
      required: false
    - name: "citation"
      type: "string"
      required: false
    - name: "section_heading"
      type: "string"
      required: false
    - name: "document"
      type: "string"
      required: false
    - name: "date"
      type: "date"
      required: false
    - name: "url"
      type: "string"
      required: false

# ── License ───────────────────────────────────────────────────────
license:
  name: "Public Domain (tribal government edict)"
  url: "https://law.mptn-nsn.gov/tribal-laws/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    The Mashantucket Pequot Tribal Laws are enacted law of a sovereign tribal
    government, published in full by the Tribal Court's law portal for public
    access. Under the government edicts doctrine enacted law is not subject to
    copyright. Freely reusable, including commercially. (West's Mashantucket
    Pequot Reports — the tribe's reported case law — is a separate commercial
    publication and is deliberately out of scope for this source.)
