# ===================================================================
# US/OR-AGPublicRecords -- Oregon Attorney General
#                          Public Records Orders
# ===================================================================
# Public Records Orders issued by the Oregon Attorney General. Under
# Oregon's Public Records Law (ORS 192.311–192.478), a person denied
# access to a state agency's public record may petition the Attorney
# General, who issues a written ORDER either directing disclosure or
# upholding the denial. Each order resolves a specific petition =
# case_law. Public domain Oregon state-government works (government
# edicts).
#
# Published as a CONTENTdm digital collection (alias p17027coll2) on
# the OCLC-hosted instance at cdm17027.contentdm.oclc.org. The public
# dmwebservices JSON API is used: dmQuery enumerates item pointers,
# dmGetItemInfo returns each item's Dublin-Core fields including the
# full-text "transc" (Transcript) field. No PDF extraction, no CAPTCHA,
# no auth.
# ===================================================================

source:
  id: "US/OR-AGPublicRecords"
  country: "US"
  name: "Oregon Attorney General — Public Records Orders"
  url: "https://cdm17027.contentdm.oclc.org/digital/collection/p17027coll2"
  description: |
    Public Records Orders issued by the Oregon Attorney General under
    Oregon's Public Records Law (ORS 192.311–192.478). When a person is
    denied access to a public record held by a state agency, they may
    petition the Attorney General, who issues a written order either
    directing the agency to disclose the record or upholding the denial.
    Each order resolves a specific petition/dispute = case_law.
    Enumerated from the AG's CONTENTdm collection (alias p17027coll2)
    via the public dmwebservices JSON API; the caption (petitioner +
    date), public body involved, order date, and the full order text are
    read from each item's Dublin-Core fields (title / subjec / date /
    transc). No CAPTCHA, no auth. ~2,682 orders. Distinct from
    US/OR-AGOpinions (formal AG legal opinions).

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 2
  burst: 3

api:
  type: "json_api"
  base_url: "https://cdm17027.contentdm.oclc.org"
  endpoints:
    query: "/digital/bl/dmwebservices/index.php?q=dmQuery/p17027coll2/0/dmrecord!date/dmrecord/{max}/{start}/0/0/0/0/json"
    item: "/digital/bl/dmwebservices/index.php?q=dmGetItemInfo/p17027coll2/{rec}/json"

data_model:
  type: "case_law"
  primary_key: "record_id"

schema:
  total_fields: 12
  key_fields:
    - name: "_id"
      description: "Stable id (US/OR-AGPublicRecords/{CONTENTdm dmrecord})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "caption"
      description: "Order caption (petitioner + order date)"
      type: "string"
      role: "identifier"
      required: false
    - name: "public_body"
      description: "Public body / agency whose record was at issue"
      type: "string"
      role: "metadata"
      required: false
    - name: "title"
      description: "Order title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the AG Public Records Order (CONTENTdm transcript field)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Order date (ISO 8601), from the CONTENTdm date field"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "url"
      description: "Link to the CONTENTdm item page"
      type: "string"
      role: "reference"
      required: true

license:
  name: "Public Domain (U.S. state government edict)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Public Records Orders of the Oregon Attorney General are official
    works of Oregon state government (government edicts) and are not
    subject to copyright. Free to use, including commercially.
