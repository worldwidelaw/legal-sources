source:
  id: US/MN-WCCA
  name: Minnesota Workers' Compensation Court of Appeals — Decisions
  country: US
  url: https://mn.gov/workcomp/
  auth: none
  data_types:
  - case_law
  description: >
    Published decisions of the Minnesota Workers' Compensation Court of Appeals
    (Minn. Stat. s. 175A), a standing appellate court of record that reviews
    compensation-judge decisions and is itself reviewable only by the Minnesota
    Supreme Court on certiorari, together with the Supreme Court's workers'
    compensation opinions (the `sup/` series). ~3,600 unique decisions,
    1988-present, served as static XHTML (plus redacted PDFs for 1988-2001) and
    enumerated from the site's own recursive directory index
    /workcomp-stat/.doclist.html.
license:
