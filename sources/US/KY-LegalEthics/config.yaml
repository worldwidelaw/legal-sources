# ===================================================================
# US/KY-LegalEthics -- Kentucky Bar Association — Ethics Opinions
# ===================================================================
# Legal-ethics opinions issued by the Kentucky Bar Association (KBA)
# interpreting the Kentucky Rules of Professional Conduct (SCR 3.130) —
# and, for the older opinions, the predecessor Canons of Professional
# Ethics — to advise LAWYERS = doctrine (advisory). One continuous
# "KBA E-" series (E-1, 1962 -> E-458+, present; ~385 published). The
# KBA is an independent agency of the Supreme Court of Kentucky with
# authority to regulate the legal profession (SCR) -> pd-us. Distinct
# from US/KY-Courts and US/KY-Legislation.
# ===================================================================

source:
  id: "US/KY-LegalEthics"
  country: "US"
  name: "Kentucky Bar Association — Ethics Opinions"
  url: "https://kybar.org/For-Members/Rules-Ethics-Information/Ethics-Opinions"
  description: |
    Legal-ethics opinions issued by the Kentucky Bar Association (KBA)
    interpreting the Kentucky Rules of Professional Conduct (SCR 3.130),
    and — for the older opinions — the predecessor Canons of Professional
    Ethics, to advise lawyers. One continuous "KBA E-" series running from
    E-1 (1962) to the E-450s (present); ~385 opinions are published free
    as born-digital PDFs on kybar.org, each carrying the opinion number, an
    issue date and a Question/Subject + analysis.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 2

api:
  type: "html_index_pdf"
  base_url: "https://kybar.org"
  endpoints:
    index: "/For-Members/Rules-Ethics-Information/Ethics-Opinions"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Stable document id (US/KY-LegalEthics/{opinion_number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Opinion code (E-{N}, zero-pad stripped; e.g. E-1, E-402, E-458)"
      type: "string"
      role: "identifier"
      required: true
    - name: "title"
      description: "Opinion label plus the Subject/Question line"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full opinion text from the born-digital PDF (PyMuPDF, no OCR)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "ISO 8601 issue date from the 'Issued: <Month [DD,] YYYY>' header"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "issuer"
      description: "Kentucky Bar Association — Ethics Committee"
      type: "string"
      role: "metadata"
      required: false
    - name: "jurisdiction"
      description: "ISO 3166-2 sub-jurisdiction code (US-KY)"
      type: "string"
      role: "metadata"
      required: false

license:
  name: "Public Domain (US government edict — integrated bar advisory opinions)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Kentucky Bar Association ethics opinions interpret the Kentucky Rules of Professional Conduct (SCR 3.130). The KBA is an independent agency of the Supreme Court of Kentucky with authority to regulate the legal profession, so the opinions are the work of a government-authorized body — treated as public domain under the 17 U.S.C. § 105 government-edicts rationale, consistent with the other state-bar legal-ethics sources. Published free to the public on kybar.org with no login, paywall or terms prohibiting reuse. Commercial use permitted."

notes: |
  - Discovery: the published corpus is indexed on a single listing page,
    /For-Members/Rules-Ethics-Information/Ethics-Opinions, which links
    every opinion PDF directly as
    "/Portals/0/Admin/Ethics Opinions/KBA E-{NNN}.pdf" (some carry a
    "?ver=..." cache-buster and the file uses either "KBA E-" or
    "KBA_E-"). ~385 opinions are published; some numbers in the 1..458
    range are reserved/withdrawn and simply not linked. We take the exact
    href from the page and never construct the URL (filenames vary).
  - Number: parsed from the PDF filename, zero-pad stripped (KBA_E-001 ->
    E-1). NOT parsed from the PDF body — older scans render the number
    with a font artifact (e.g. "KBA E-l" for E-1).
  - Full text: each PDF is born-digital (text layer) -> PyMuPDF/fitz
    get_text, NO OCR. Header = "KENTUCKY BAR ASSOCIATION / Ethics Opinion
    KBA E-{N} / Issued: {Month [DD,] YYYY}" + rules-amendment disclaimer +
    "Subject:" / "Question[.:]" block + analysis.
  - Title: the Subject/Question line following the disclaimer; falls back
    to a generic "Kentucky Bar Association Ethics Opinion KBA E-{N}".
  - Date: "Issued: March 1962" (older) and "Issued: March 15, 2024"
    (newer, with day) -> YYYY-MM-DD (day defaults to 01 when absent).
  - Type: every document is the KBA Ethics Committee's advisory
    interpretation of the rules governing lawyers = doctrine.
  - Distinct from US/KY-Courts (Kentucky appellate courts) and
    US/KY-Legislation (KRS / legislature.ky.gov).
