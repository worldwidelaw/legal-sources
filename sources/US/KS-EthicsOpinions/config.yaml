# ===================================================================
# US/KS-EthicsOpinions -- Kansas Governmental Ethics Commission
#                         — Advisory Opinions
# ===================================================================
# Advisory opinions issued by the Kansas Governmental Ethics Commission
# (formerly the Kansas Commission on Governmental Standards & Conduct;
# administered via the Kansas Public Disclosure Commission) under
# K.S.A. 46-254, interpreting the state conflict-of-interest, lobbying
# and campaign-finance laws (K.S.A. ch. 25 + ch. 46). Every opinion is
# filed with the Secretary of State and published = doctrine.
# Born-digital, full-text CLEAN HTML (no PDF, no OCR, no CAPTCHA,
# no auth). Public-domain State of Kansas government works.
# ===================================================================

source:
  id: "US/KS-EthicsOpinions"
  country: "US"
  name: "Kansas Governmental Ethics Commission — Advisory Opinions"
  url: "https://www.kansas.gov/kpdc-opinion/"
  description: |
    Advisory opinions of the Kansas Governmental Ethics Commission
    (administered via the Kansas Public Disclosure Commission). Under
    K.S.A. 46-254 the Commission issues advisory opinions construing the
    Kansas governmental-ethics statutes: the state conflict-of-interest
    provisions (K.S.A. 46-215 et seq.), the campaign-finance act
    (K.S.A. 25-4142 et seq.) and the lobbying-disclosure statutes.
    Each opinion is a public record filed with the Secretary of State
    and published on kansas.gov as a born-digital HTML page whose text
    layer is extracted directly (no OCR). Opinion numbers are 'YYYY-NN'.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 1

api:
  type: "html_index"
  base_url: "https://www.kansas.gov"
  endpoints:
    view: "/kpdc-opinion/opinion/view/{id}"
    search_by_area: "/kpdc-opinion/search/searchByArea?area={n}"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Stable document id (US/KS-EthicsOpinions/{opinion_number})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "opinion_number"
      description: "Advisory opinion number (e.g. 2024-01, 1997-44)"
      type: "string"
      role: "identifier"
      required: false
    - name: "title"
      description: "Opinion number + synopsis caption"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the opinion, from the born-digital HTML body"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Issue date (ISO 8601), parsed from the opinion body ('Month DD, YYYY'), fallback to opinion-number year"
      type: "date"
      role: "temporal_key"
      required: false

license:
  name: "Public Domain (State of Kansas Government Work)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Advisory opinions of the Kansas Governmental Ethics Commission are official public records of the State of Kansas, filed with the Secretary of State and published for public use with no copyright restriction."

notes: |
  - Full text: each opinion is a born-digital HTML page at
    https://www.kansas.gov/kpdc-opinion/opinion/view/{id}; the
    <main id="main-content"> container holds the entire opinion body
    (issue date, 'Opinion No. YYYY-NN', recipient, Synopsis, 'Cited
    herein' statutes and the full opinion letter). No PDF, no OCR.
  - Enumeration: the three search endpoints cap at 10 results and ignore
    paging, so they expose only ~40 recent opinions. The full historical
    corpus is reached by a bounded /opinion/view/{id} scan: opinion ids
    form a near-contiguous block from ~660 (Opinion 1990-04) to ~2496
    (Opinion 2024-03). Miss pages render the search form (no 'Opinion
    No.'); hit pages contain 'Opinion No. YYYY-NN'.
  - Type: every published document is an advisory opinion = doctrine.
  - Date: parsed from the first 'Month DD, YYYY' in the opinion body,
    with a fallback to the year embedded in the opinion number.
  - COVERAGE: ~1,800 advisory opinions 1990-present (the digitized set;
    pre-1990 opinions are not in the app). Opinion numbers reset yearly
    (YYYY-NN) across four subject areas (state COI, local COI, lobbying,
    campaign finance).
