api:
  metadata_base: https://fotogalerija.dz-rs.si/datoteke/opendata/
  rate_limit: 1
  transcript_base: https://www.dz-rs.si/wps/portal/Home/seje/evidenca
schema:
  fields:
    date:
      description: Session date (ISO 8601)
      type: date
    mandate:
      description: Parliamentary mandate number (2-10)
      type: integer
    session_number:
      description: Session number (e.g., "132")
      type: string
    session_type:
      description: Session type (Redna=regular, Izredna=extraordinary)
      type: string
    text:
      description: Full verbatim transcript text (MANDATORY)
      type: string
    title:
      description: Session title
      type: string
  key_fields:
  - name: _id
    required: true
    type: string
  - name: title
    required: true
    type: string
  - name: text
    required: true
    type: string
  - name: date
    required: true
    type: date
  - name: url
    required: true
    type: string
  - name: mandate
    required: true
    type: integer
  - name: session_number
    required: true
    type: string
source:
  country: SI
  description: 'Verbatim transcripts of plenary sessions of the Slovenian National Assembly

    (Državni zbor) from 1992 to present. Data from Parliament open data XML

    files (session metadata) combined with full transcript text from the

    Parliament website.


    Covers parliamentary mandates 2-10 with ~2,360 session transcripts (one
    record per sitting day, keyed on the transcript UID).

    '
  id: SI/DrzavniZbor
  license: Open Data (Slovenian Parliament)
  license_url: https://www.dz-rs.si/wps/portal/Home/ostalo/OpenData
  name: Slovenian National Assembly (Državni zbor)
  type: doctrine
  url: https://www.dz-rs.si
