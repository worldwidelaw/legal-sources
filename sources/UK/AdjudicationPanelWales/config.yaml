# UK/AdjudicationPanelWales — The Adjudication Panel for Wales (Panel Dyfarnu
# Cymru) — Decision Reports.
#
# Source: Adjudication Panel for Wales (APW), the independent statutory tribunal
#         under Part III of the Local Government Act 2000, funded by the Welsh
#         Government but independent of it.
# URL: https://adjudicationpanel.gov.wales/decisions
# Data type: case_law  (Wales / GB-WLS — NOT covered by UK/CaseLaw, which indexes
#            England & Wales superior courts + reserved UK tribunals via the
#            National Archives Find Case Law service)
# Auth: none
#
# APW determines allegations that elected/co-opted members of Welsh councils,
# national park authorities and fire authorities have breached their authority's
# statutory code of conduct. Cases are referred by the Public Services Ombudsman
# for Wales to a Case Tribunal (case_type 1, ref .../CT) or reach an Appeal
# Tribunal (case_type 2, ref .../AT). Its "Decision Reports" (findings + any
# sanction) are published as born-digital PDFs.
#
# Total: a few hundred full-text decision reports, 2003-present
#
# Access (same Drupal 11 platform as UK/RPTWales):
#   - /decisions/{case_type}/%2A lists April-March tribunal-year windows.
#   - Each year window lists per-decision detail-page slugs (/apw{digits}-…).
#   - Each detail page carries name / reference / relevant authority / nature of
#     allegation / hearing date / tribunal decision (packed in
#     <meta name="description">) and the decision-report PDF under
#     /sites/adjudicationpanel/files/.
#   - Download each born-digital PDF, extract full text with PyMuPDF (pdfplumber/
#     pypdf fallback). No OCR needed.

source:
  id: UK/AdjudicationPanelWales
  name: The Adjudication Panel for Wales — Decision Reports
  country: UK
  data_types:
    - case_law
  url: https://adjudicationpanel.gov.wales/decisions
  language: en
  auth: none
  license: ogl-3.0

jurisdictions:
  - code: GB-WLS
    scope: full

license:
  name: "Open Government Licence v3.0"
  url: "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    Site copyright statement: most material is Crown copyright and may be used
    and re-used free of charge in any format or medium under the Open Government
    Licence (must reproduce accurately, not in a misleading context).

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - respondent
    - authority
    - allegation
    - outcome
    - panel
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.5
  page_size: 30
  estimated_total: 400
  sample_count: 15
