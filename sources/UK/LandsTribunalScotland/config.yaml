# UK/LandsTribunalScotland — The Lands Tribunal for Scotland — Decisions.
#
# Source: The Lands Tribunal for Scotland, the specialist Scottish tribunal that
#         determines disputes about land and property under the Lands Tribunal Act
#         1949 and later statutes — discharge/variation of title conditions (real
#         burdens), disputed compensation on compulsory purchase, valuation for
#         rating appeals, tenants' right-to-buy references, Land Register appeals,
#         and electronic-communications-code (telecoms) references. The Chairman
#         of the Scottish Land Court also serves as President of the Lands
#         Tribunal; the two share offices but are separate judicial bodies.
# URL: http://www.lands-tribunal-scotland.org.uk/decisions/previous-decisions
# Data type: case_law  (Scotland / GB-SCT — a Scottish tribunal, NOT covered by
#            UK/CaseLaw, which indexes England & Wales superior courts + reserved
#            UK tribunals via the National Archives Find Case Law service)
# Auth: none
#
# Decisions carry the neutral citation "[YYYY] LTS N" and case reference
# "LTS/{CAT}/{YYYY}/{NNNN}". The full Opinion / Note of the Tribunal is published
# as inline HTML on each decision page (born-digital text, no PDF, no OCR).
#
# Access:
#   - /decisions/previous-decisions lists the subject categories
#     (disputed-compensation, valuation-for-rating, tenants-rights-to-buy,
#      discharge-of-land-obligations, land-register-appeals, title-conditions,
#      ecc, others).
#   - Each category page lists per-decision slugs /decisions/LTS.{CAT}.{YYYY}.{NN}.
#   - Each decision page carries the citation, case reference, tribunal members
#     and the full Opinion text inline in <body> (<header> metadata + <main> body).

source:
  id: UK/LandsTribunalScotland
  name: The Lands Tribunal for Scotland — Decisions
  country: UK
  data_types:
    - case_law
  url: http://www.lands-tribunal-scotland.org.uk/decisions/previous-decisions
  language: en
  auth: none
  license: custom-terms

jurisdictions:
  - code: GB-SCT
    scope: full

license:
  name: "SCTS terms (personal / in-house use only)"
  url: "https://www.scotcourts.gov.uk/terms-of-use"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    The Lands Tribunal for Scotland is administered alongside the Scottish Land
    Court under the Scottish Courts and Tribunals Service (SCTS). SCTS terms
    permit reproduction of judgments/decisions for personal and in-house use but
    restrict commercial re-use without consent — flagged as commercial-restricted
    (same basis as UK/ScotHousingChamber / UK/ScotTaxChamber). Not OGL.

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - citation
    - category
    - tribunal_members
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.0
  page_size: 100
  estimated_total: 460
  sample_count: 15
