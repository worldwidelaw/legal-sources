# UK/ScotTaxChamber — First-tier Tribunal for Scotland Tax Chamber — Decisions.
#
# Source: First-tier Tribunal for Scotland Tax Chamber (FTS Tax Chamber), whose
#         administration is provided by the Scottish Courts and Tribunals Service
#         (SCTS). The Tax Chamber decides appeals against decisions of Revenue
#         Scotland on the devolved Scottish taxes — Land and Buildings Transaction
#         Tax (LBTT), Scottish Landfill Tax (SLfT) — and related penalty/review
#         matters under the Revenue Scotland and Tax Powers Act 2014.
# URL: https://taxtribunals.scot/
# Data type: case_law  (Scotland / GB-SCT — a devolved Scottish tribunal, NOT
#            covered by UK/CaseLaw, which indexes England & Wales superior courts
#            + reserved UK tribunals via the National Archives Find Case Law
#            service; FTS Tax Chamber decisions are not on that service)
# Auth: none
#
# Decisions carry the neutral citation "[YYYY] FTSTC N" and are published as
# born-digital PDFs directly on the site homepage, each accompanied by an HTML
# summary table (Appellant, Respondent, Tribunal members, Decision Date,
# Application Type, Tax Type, Notes/subject). Coverage: 2016-present.
#
# Access:
#   - GET https://taxtribunals.scot/ — the page embeds one
#     <table class="decision-table-summary"> per decision, with the metadata
#     fields and a "Decision Document" link to decisions/[YYYY] FTSTC N.pdf.
#   - Download each born-digital PDF and extract full text with PyMuPDF
#     (pdfplumber/pypdf fallback). No OCR needed.
#   - One record per decision.

source:
  id: UK/ScotTaxChamber
  name: First-tier Tribunal for Scotland Tax Chamber — Decisions
  country: UK
  data_types:
    - case_law
  url: https://taxtribunals.scot/
  language: en
  auth: none
  license: custom-terms

jurisdictions:
  - code: GB-SCT
    scope: full

license:
  name: "SCTS terms (personal / in-house use only)"
  url: "https://www.scotcourts.gov.uk/terms-of-use"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    Administered by the Scottish Courts and Tribunals Service (SCTS). SCTS
    website terms permit reproduction of judgments/decisions for personal and
    in-house use but restrict commercial re-use without consent — flagged as
    commercial-restricted (same basis as UK/ScotHousingChamber). Not OGL.

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - appellant
    - respondent
    - tax_type
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.5
  page_size: 100
  estimated_total: 75
  sample_count: 15
