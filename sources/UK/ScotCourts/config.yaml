# UK/ScotCourts — Scottish Courts and Tribunals Service judgments.
#
# Source: The Scottish Courts and Tribunals Service (SCTS) publishes the full
#         text of judgments and opinions from Scotland's superior/appellate
#         courts and the Upper Tribunal for Scotland. Courts covered by the
#         single "Judgments" index:
#           - Court of Session (Inner/Outer House)     [CSIH/CSOH]
#           - High Court of Justiciary                 [HCJAC/HCJ]
#           - Sheriff Appeal Court (Civil & Criminal)
#           - Sheriff Courts (Civil & Criminal)
#           - National Personal Injury Court
#           - Upper Tribunal for Scotland (all chambers)
# URL: https://www.scotcourts.gov.uk/judgments/
# Data type: case_law (Scotland / GB-SCT). NOT covered by UK/CaseLaw, which
#            indexes England & Wales superior courts + reserved UK tribunals via
#            the National Archives "Find Case Law" service; Scottish court
#            judgments are not on that service. Distinct from the devolved
#            Scottish first-tier tribunal chambers (UK/ScotHousingChamber,
#            UK/ScotTaxChamber, UK/ScotLocalTaxChamber, UK/ScotHealthEducationChamber).
# Auth: none
#
# The judgments page (/judgments/) is a client-side Vue search app backed by a
# public JSON API (base read from the page's data-base-url attribute):
#   https://api.pa.web.scotcourts.gov.uk/web
# Two operations (autorest/@azure client baked into the JS bundle):
#   GET  /web/definition/{contentId}  -> index config (indexType/limit)
#   POST /web/search                  -> paginated results
# Search POST body:
#   {"query":"","filters":[],"page":N,"indexType":"Judgments","category":"","limit":50}
# Each result: title, documentLink (/media/<id>/<citation>-....pdf), date,
# court[], sheriffdom[], judges[], additionalDate, tags[].
#
# Access:
#   - POST /web/search paging 1..pagination.page.total (limit 50), newest first.
#   - Download https://www.scotcourts.gov.uk{documentLink} (born-digital PDF) and
#     extract full text with PyMuPDF (pdfplumber/pypdf fallback). No OCR needed.
#   - Metadata from the API + PDF filename; full text from the PDF.
#   - One record per judgment PDF.

source:
  id: UK/ScotCourts
  name: Scottish Courts and Tribunals Service — Judgments
  country: UK
  data_types:
    - case_law
  url: https://www.scotcourts.gov.uk/judgments/
  language: en
  auth: none
  license: custom-terms

jurisdictions:
  - code: GB-SCT
    scope: full

license:
  name: "SCTS terms (personal / in-house use only)"
  url: "https://www.scotcourts.gov.uk/terms-of-use"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    Published by the Scottish Courts and Tribunals Service (SCTS). SCTS website
    terms permit reproduction of judgments/decisions for personal and in-house
    use but restrict commercial re-use without consent — flagged as
    commercial-restricted (same basis as UK/ScotHousingChamber,
    UK/ScotTaxChamber, UK/ScotLocalTaxChamber). Not OGL.

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: neutral_citation
      type: string
      required: false
  indexed_fields:
    - title
    - text
    - neutral_citation
    - court
    - judges
    - sheriffdom
  date_field: date

fetch:
  rate_limit_delay: 1.0
  page_size: 50
  estimated_total: 13120
  sample_count: 15
