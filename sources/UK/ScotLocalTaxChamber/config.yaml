# UK/ScotLocalTaxChamber — First-tier Tribunal for Scotland Local Taxation Chamber.
#
# Source: First-tier Tribunal for Scotland Local Taxation Chamber (LTC),
#         established 1 April 2023, whose administration is provided by the
#         Scottish Courts and Tribunals Service (SCTS). The LTC decides Scottish
#         local-taxation appeals — council tax (banding, liability, discounts,
#         exemptions, penalties), non-domestic (business) rates and
#         rateable-value / valuation-roll appeals, and water/sewerage charge
#         appeals. It absorbed the former Valuation Appeal Committees and the
#         Council Tax Reduction Review Panel.
# URL: https://www.localtaxationchamber.scot/
# Data type: case_law  (Scotland / GB-SCT — a devolved Scottish tribunal, NOT
#            covered by UK/CaseLaw, which indexes England & Wales superior courts
#            + reserved UK tribunals via the National Archives Find Case Law
#            service; LTC decisions are not on that service). Distinct from
#            UK/ScotTaxChamber (devolved *national* taxes: LBTT/SLfT).
# Auth: none
#
# The site (www.localtaxationchamber.scot) is a React single-page app; its
# "Decisions" view is backed by an Azure Blob Storage account. The decision PDFs
# live in a publicly-listable container:
#   https://ltcpastrauks003.blob.core.windows.net/decision-documents
# (account + container names are read from the app's own runtime config baked
# into the JS bundle; anonymous blob-list + blob-read, no SAS token).
#
# Access:
#   - List the container via the Azure "list container" REST call
#     (?restype=container&comp=list), following NextMarker if present.
#   - Each blob is a born-digital decision PDF named
#     "Decision (Appeal) 23.00012.pdf" / "Decision (Upper Tribunal Referral) …".
#   - Download each PDF and extract full text with PyMuPDF (pdfplumber/pypdf
#     fallback). No OCR needed.
#   - Parse Chamber Ref (FTS/LTC/XX/YY/NNNNN), parties, tribunal member and
#     decision date from the PDF text; decision type from the filename.
#   - One record per decision PDF.

source:
  id: UK/ScotLocalTaxChamber
  name: First-tier Tribunal for Scotland Local Taxation Chamber — Decisions
  country: UK
  data_types:
    - case_law
  url: https://www.localtaxationchamber.scot/
  language: en
  auth: none
  license: custom-terms

jurisdictions:
  - code: GB-SCT
    scope: full

license:
  name: "SCTS terms (personal / in-house use only)"
  url: "https://www.scotcourts.gov.uk/terms-of-use"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    Administered by the Scottish Courts and Tribunals Service (SCTS). SCTS
    website terms permit reproduction of judgments/decisions for personal and
    in-house use but restrict commercial re-use without consent — flagged as
    commercial-restricted (same basis as UK/ScotHousingChamber and
    UK/ScotTaxChamber). Not OGL.

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - appellant
    - respondent
    - decision_type
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.0
  page_size: 5000
  estimated_total: 1185
  sample_count: 15
