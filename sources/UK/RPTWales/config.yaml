# UK/RPTWales — Residential Property Tribunal Wales (Tribiwnlys Eiddo Preswyl) —
# Decisions.
#
# Source: Residential Property Tribunal Wales (RPTW), funded by the Welsh
#         Government; the tribunal, its members and its decisions are independent
#         of central and local government.
# URL: https://residentialpropertytribunal.gov.wales/decisions
# Data type: case_law  (Wales / GB-WLS — NOT covered by UK/CaseLaw, which indexes
#            England & Wales superior courts + reserved UK tribunals via the
#            National Archives Find Case Law service; RPTW is not on that service)
# Auth: none
#
# RPTW is the statutory tribunal for Wales resolving private-rented and leasehold
# residential-property disputes under the Housing Act 2004, Landlord and Tenant
# Act 1985/1987, Commonhold and Leasehold Reform Act 2002, Rent Act 1977, etc. It
# sits in three panels, each publishing its own born-digital decision PDFs:
#   2  Leasehold Valuation Tribunals (lvt)  | 1  Rent Assessment Committees (rac)
#   4  Residential Property Tribunals (rpt) | (case-type id 3 publishes nothing)
#
# Total: several thousand full-text decisions, April 2012-present
#
# Access:
#   - /decisions/{case_type}/%2A lists April-March "tribunal year" windows.
#   - Each year window lists per-decision detail-page slugs (/{prefix}{digits}-…).
#   - Each detail page carries the reference number / Act / case type / property
#     metadata and one or more decision PDFs under
#     /sites/residentialproperty/files/.
#   - Download each born-digital PDF, extract full text with PyMuPDF (pdfplumber/
#     pypdf fallback). No OCR needed.

source:
  id: UK/RPTWales
  name: Residential Property Tribunal Wales — Decisions
  country: UK
  data_types:
    - case_law
  url: https://residentialpropertytribunal.gov.wales/decisions
  language: en
  auth: none
  license: ogl-3.0

jurisdictions:
  - code: GB-WLS
    scope: full

license:
  name: "Open Government Licence v3.0"
  url: "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    Site copyright statement: most material is Crown copyright and may be used
    and re-used free of charge in any format or medium under the Open Government
    Licence (must reproduce accurately, not in a misleading context).

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - property
    - act
    - panel
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.5
  page_size: 30
  estimated_total: 4000
  sample_count: 15
