# UK/GOsC — General Osteopathic Council — Fitness to Practise decisions.
#
# Source: General Osteopathic Council (GOsC), the UK statutory regulator for
#         osteopaths under the Osteopaths Act 1993. Fitness to practise concerns
#         are heard by the independent Professional Conduct Committee (PCC) and
#         Health Committee (HC), with interim orders made by the Investigating
#         Committee (IC/ISO).
# URL: https://www.osteopathy.org.uk/raising-a-concern/hearings/decisions/
# Data type: case_law  (UK statutory professional-regulator adjudications —
#            distinct from UK/GMC doctors, UK/GDC dentists, UK/GOC opticians,
#            UK/GPhC pharmacists, UK/SDT solicitors, UK/BTAS barristers,
#            UK/HCPTS health & care professions, UK/NMC nurses/midwives,
#            UK/SocialWorkEngland).
# Auth: none
#
# osteopathy.org.uk was rebuilt on WordPress in 2026: every published case
# (undertakings, interim suspension orders, council decisions, PCC/HC hearing
# outcomes) is a `hearing_decision` custom post type exposed through the site's
# open WP REST API:
#     /wp-json/wp/v2/hearing_decision?per_page=100
# giving id, slug, link, title (ending with the decision date) and a
# hearing_decision_type taxonomy term. Each post lives at
# /hearing-decision/{slug}/ and links the reasoned decision as a BORN-DIGITAL PDF
# under /wp-content/uploads/YYYY/MM/ (content-type application/pdf, real text
# layer, no OCR): a structured header (Case No / committee / hearing date /
# case-of name / committee members / legal assessor) followed by the numbered
# reasoned decision. The published set is a rolling window (older removed under
# the GOsC publication policy), so one run captures the current window and
# re-runs accumulate (the pipeline dedups on _id = the stable decision slug).
#
# Total: 44 full-text decisions of the 46 currently published (2 are image-only
# scans needing OCR).

source:
  id: UK/GOsC
  name: General Osteopathic Council (GOsC) — Fitness to Practise decisions
  country: UK
  data_types:
    - case_law
  url: https://www.osteopathy.org.uk/raising-a-concern/hearings/decisions/
  language: en
  auth: none
  license: custom-terms

license:
  name: "GOsC website terms (no explicit open licence stated)"
  url: "https://www.osteopathy.org.uk/terms-and-conditions/"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >-
    GOsC fitness-to-practise decisions are public professional-regulator
    adjudication records published by the General Osteopathic Council under its
    fitness-to-practise publication policy. The site states no explicit open
    licence (GOsC / Crown copyright applies to the underlying records), so
    commercial re-use is conservatively flagged per project policy, consistent
    with the sibling UK professional-regulator tribunal sources (UK/GMC, UK/GDC,
    UK/GOC, UK/SDT, UK/BTAS, UK/HCPTS, UK/NMC, UK/GPhC).

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: url
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - registrant
    - case_number
    - hearing_type
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.0
  estimated_total: 40
  sample_count: 15
