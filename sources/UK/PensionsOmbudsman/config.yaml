# ═══════════════════════════════════════════════════════════════════
# Legal Data Hunter — UK Pensions Ombudsman (TPO) Determinations
# ═══════════════════════════════════════════════════════════════════

# ── Source Identity ───────────────────────────────────────────────
source:
  id: "UK/PensionsOmbudsman"
  country: "UK"
  name: "The Pensions Ombudsman (TPO) — Determinations"
  url: "https://www.pensions-ombudsman.org.uk/decisions"
  description: |
    Published determinations of The Pensions Ombudsman (TPO), the statutory
    tribunal (Pension Schemes Act 1993) that investigates and decides complaints
    and disputes about the administration and management of occupational and
    personal pension schemes. TPO determinations are final and binding on the
    parties, enforceable in the county court, and appealable only on a point of
    law to the High Court. ~6,700 determinations (1998-present). Full text via
    born-digital PDFs (and legacy .docx); older binary .doc files skipped.

# ── Data Types ────────────────────────────────────────────────────
data_types:
  - case_law

# ── Authentication ────────────────────────────────────────────────
auth:
  type: "none"

# ── Rate Limiting ─────────────────────────────────────────────────
rate_limit:
  requests_per_second: 1
  burst: 3

# ── API / Scraping Configuration ──────────────────────────────────
api:
  type: "html"
  base_url: "https://www.pensions-ombudsman.org.uk"
  endpoints:
    listing:
      path: "/decisions?page={page}"
      method: "GET"
      description: "Paginated Drupal decisions archive (12 cards/page, ~565 pages)"
    decision:
      path: "/decision/{year}/{ref}/{slug}"
      method: "GET"
      description: "Individual decision page; links to the determination file"
    file:
      path: "/sites/default/files/decisions/{ref}.pdf"
      method: "GET"
      description: "Born-digital determination PDF (or legacy .doc/.docx)"

# ── Data Model ────────────────────────────────────────────────────
data_model:
  type: "case_law"
  primary_key: "case_id"
  update_strategy: "upsert"
  versioning: "date"

# ── Schema ────────────────────────────────────────────────────────
schema:
  key_fields:
    - name: "case_id"
      type: "string"
      role: "primary_key"
    - name: "title"
      type: "string"
      role: "content"
    - name: "text"
      type: "string"
      role: "content"
    - name: "date"
      type: "date"
      role: "temporal_key"
    - name: "url"
      type: "string"
      role: "reference"
    - name: "complainant"
      type: "string"
      role: "classification"
    - name: "respondent"
      type: "string"
      role: "classification"
    - name: "outcome"
      type: "string"
      role: "classification"
    - name: "topic"
      type: "string"
      role: "classification"

# ── License ───────────────────────────────────────────────────────
license:
  name: "Custom terms (© The Pensions Ombudsman)"
  url: "https://www.pensions-ombudsman.org.uk/terms-and-conditions"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >
    No explicit Open Government Licence statement on the site; footer asserts
    "© The Pensions Ombudsman". Commercial use flagged pending confirmation.

# ── Notes ─────────────────────────────────────────────────────────
notes: |
  - Language: English
  - ~6,700 determinations (Great Britain; 1998-present)
  - Listing cards carry full metadata (ref, date, complainant, respondent,
    outcome, complaint topic); full text is in the linked determination file
  - Modern determinations are born-digital PDFs (extracted via common.pdf_extract,
    no OCR); some middle-era .docx (python-docx); legacy binary .doc skipped
  - No authentication required
  - Distinct from IE/FSPO (Ireland) and the Financial Ombudsman Service (UK/FinancialOmbudsman)
