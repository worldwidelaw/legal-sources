fetcher:
  configs:
    content: content
    metadata: metadata
  dataset: th1nhng0/vietnamese-legal-documents
  rate_limit: 1.0
  split: data
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: title
    required: true
    type: string
  - name: text
    required: true
    type: string
  - name: date
    required: false
    type: date
  - name: document_number
    required: false
    type: string
  - name: legal_type
    required: false
    type: string
  - name: issuing_authority
    required: false
    type: string
  - name: legal_sectors
    required: false
    type: string
  - name: signers
    required: false
    type: string
  - name: effect_status
    required: false
    type: string
  - name: url
    required: true
    type: string
source:
  auth: none
  country: VN
  data_types:
  - legislation
  description: 'Vietnamese legal documents from thuvienphapluat.vn, accessed via the HuggingFace
    dataset th1nhng0/vietnamese-legal-documents (CC-BY-4.0). The ''metadata'' config carries
    171,556 records (Vietnamese column names, string ids) and the ''content'' config 170,824
    full-text documents as HTML, joined on id. Full text in Vietnamese.

    '
  format: parquet
  id: VN/ThuVienPhapLuat
  language: vi
  name: Thu Vien Phap Luat - Vietnamese Legal Library
  url: https://thuvienphapluat.vn/
