auth:
  type: none
country: TR
data_types:
- legislation
description: 'Official Turkish legislation database maintained by the Presidency of Turkey. Contains laws (kanunlar), decrees with force of law (KHK), regulations (tüzükler), directives (yönetmelikler),
  and presidential decrees (cumhurbaşkanlığı kararnameleri).

  '
discovery:
  # MevzuatTur=6 is the aggregate lane: it enumerates the whole corpus (~19,069
  # docs) including the tur 8/9/17/20 types no single-type query returns.
  aggregate_mevzuat_tur: 6
endpoints:
  content_iframe: /anasayfa/MevzuatFihristDetayIframe
  datatable: /Anasayfa/MevzuatDatatable
language: tr
license:
  name: Public Domain (Government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Official Turkish government legislation — public domain under Turkish law
name: Turkish Legislation (Mevzuat Bilgi Sistemi)
rate_limit:
  delay_between_requests: 1.5
  requests_per_second: 1
schema:
  key_fields:
  - name: mevzuat_no
    required: false
    type: string
  - name: mevzuat_tur
    required: false
    type: integer
  - name: mevzuat_tur_name
    required: false
    type: string
  - name: mevzuat_tertip
    required: false
    type: string
source_id: TR/Mevzuat
url: https://www.mevzuat.gov.tr
