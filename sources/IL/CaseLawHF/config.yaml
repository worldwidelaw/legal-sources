source_id: IL/CaseLawHF
name: Israeli Case Law Dataset (HuggingFace)
country: IL
url: https://huggingface.co/datasets/guychuk/case-law-israel
description: |
  Israeli court judgments from HuggingFace dataset guychuk/case-law-israel.
  Full text in Hebrew via document_text field. Covers the whole hierarchy —
  Supreme, District, Magistrate, Family, Local Affairs, Traffic, Small Claims,
  Juvenile and Labour courts plus parole boards — across six districts.
  Parquet streaming via HuggingFace datasets library.
  10,558 rows, of which ~48% carry only PDF metadata with no retrievable text
  and are skipped, so ~5,500 judgments are ingestible.

data_types:
  - case_law

license:
  name: "Unverified — sourced from Israeli court records"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "HuggingFace dataset by guychuk. Sourced from Israeli court system."

language: he

auth:
  type: none

rate_limit:
  requests_per_second: 5
  burst: 10

update_frequency: unknown

schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: title
      required: true
      type: string
    - name: text
      required: true
      type: string
    - name: date
      required: false
      type: string
    - name: court
      required: false
      type: string
    - name: court_tier
      required: false
      type: integer
    - name: court_id
      required: false
      type: string
    - name: case_number
      required: false
      type: string
    # url is an aggregator deep link, never a publisher link — see README.
    - name: url_provenance
      required: true
      type: string
    - name: publisher_url
      required: false
      type: string
  date_field: date
  text_field: text
  title_field: title
  url_field: url
