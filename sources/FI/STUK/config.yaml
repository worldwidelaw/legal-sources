source:
  id: FI/STUK
  name: STUK — Radiation and Nuclear Safety Authority YVL / VAL Guides
  country: FI
  url: https://stuk.fi/en/yvl-guides
  description: >
    Regulatory guides issued by STUK, Finland's Radiation and Nuclear Safety
    Authority. The YVL Guides (series A–E) set the detailed binding regulatory
    requirements for the safety of Finnish nuclear facilities under the Nuclear
    Energy Act; the VAL Guides cover radiation safety. Each guide is enumerated
    from the STUK index pages (/en/yvl-guides, /en/val-guides) and its full text
    is extracted from the server-rendered STUKLEX legal-database page at
    https://www.stuklex.fi/en/ohje/{ID}. STUKLEX classifies each guide as a
    "Regulation", so they are recorded as legislation (regulations).

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - guide_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: guide_id
      type: string
      required: true
    - name: guide_no
      type: string
      required: false

license:
  name: "Finnish Open Government Data"
  url: "https://www.avoindata.fi/en"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >
    STUKLEX regulatory guides are public-authority regulatory text published by
    STUK. Reused as Finnish open government data with attribution to STUK.

schedule:
  full_refresh: monthly
  update_check: monthly
