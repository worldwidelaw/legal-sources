# IE/RTB — Residential Tenancies Board of Ireland (Determination Orders)
#
# Source: Residential Tenancies Board (RTB), Ireland
# URL: https://rtb.ie/disputes/dispute-outcomes-and-orders/adjudication-and-tribunal-orders/
# Data type: case_law
# Auth: none
# License: PSI Licence / CC BY 4.0 (Irish public sector information)
#
# The RTB is Ireland's statutory residential-tenancy dispute-resolution body
# (Residential Tenancies Act 2004 as amended). Binding Determination Orders
# (s.121) issue from adjudication and Tenancy Tribunal hearings and are
# enforceable in the Circuit Court — adjudicative case law.
#
# Total: ~21,500 Determination Orders, 2015-present
#   Adjudication Orders ~16,400 | Tribunal Orders ~5,100 | Court Decisions ~33
#
# Access:
#   - WordPress REST API, one custom post type per category:
#       /wp-json/wp/v2/{adjudication-order,tribunal-order,court-decision-order}
#       (100/page, deep pagination; title = parties, dispute-type taxonomy)
#   - Determination Order PDF via /wp-json/wp/v2/media?parent={post_id}
#   - PDFs are SCANNED IMAGES -> full text via tesseract OCR (PyMuPDF raster,
#     piped to tesseract on stdin). Case Reference + date parsed from OCR text.

source:
  id: IE/RTB
  name: Residential Tenancies Board of Ireland (Determination Orders)
  country: IE
  data_types:
    - case_law
  url: https://rtb.ie/disputes/dispute-outcomes-and-orders/adjudication-and-tribunal-orders/
  language: en
  auth: none
  license: cc-by-4.0

license:
  name: "PSI Licence / CC BY 4.0"
  url: "https://www.gov.ie/en/help/re-use-of-public-sector-information/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Irish public sector information re-use framework (default CC BY 4.0)."

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: order_type
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - order_type
    - dispute_types
    - court
  date_field: date

fetch:
  rate_limit_delay: 1.5
  page_size: 100
  estimated_total: 21500
  sample_count: 15
