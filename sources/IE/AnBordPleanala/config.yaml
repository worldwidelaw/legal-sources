# IE/AnBordPleanala — An Bord Pleanála / An Coimisiún Pleanála (Irish Planning Appeals Board) — Decisions
#
# Source: An Bord Pleanála (rebranded An Coimisiún Pleanála in 2024), Ireland
# URL: https://www.pleanala.ie/en-ie/case-search
# Data type: case_law
# Auth: none
# License: PSI Licence / CC BY 4.0 (Irish public sector information)
#
# National independent statutory body deciding planning/infrastructure appeals
# and applications under the Planning and Development Act 2000. For each
# determined case the reasoned Inspector's Report is published as a born-digital
# PDF (text layer) = the substantive adjudicative reasoning.
#
# Total: ~20,000+ determined cases with Inspector's Reports, 2016-present
#
# Access:
#   - Case listing (windowed by decision date, 500-result cap → monthly windows):
#       /en-ie/cases?decisionFrom=YYYY-MM-DD&decisionTo=YYYY-MM-DD
#   - Case detail: /en-ie/case/{N} (metadata + Inspector's Report PDF link)
#   - Inspector's Report: /anbordpleanala/media/abp/cases/reports/{N[:3]}/r{N}.pdf
#     (born-digital; full text via PyMuPDF/fitz). Board Order/Direction PDFs are
#     scanned images (skipped).

source:
  id: IE/AnBordPleanala
  name: An Bord Pleanála (An Coimisiún Pleanála) — Planning Appeal Decisions
  country: IE
  data_types:
    - case_law
  url: https://www.pleanala.ie/en-ie/case-search
  language: en
  auth: none
  license: cc-by-4.0

license:
  name: "PSI Licence / CC BY 4.0"
  url: "https://www.gov.ie/en/help/re-use-of-public-sector-information/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Irish public sector information re-use framework (default CC BY 4.0)."

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: case_ref
      type: string
      required: true
    - name: text
      type: string
      required: true
  indexed_fields:
    - title
    - text
    - case_ref
    - case_type
    - decision
    - address
  date_field: date

fetch:
  rate_limit_delay: 1.5
  page_size: 500
  estimated_total: 20000
  sample_count: 15
