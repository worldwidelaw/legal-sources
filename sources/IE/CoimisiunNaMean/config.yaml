# IE/CoimisiunNaMean — Coimisiún na Meán (Ireland's media regulator) — Complaint Decisions
#
# Source: Coimisiún na Meán, Ireland
# URL: https://www.cnam.ie/general-public/report-complain/something-i-saw-on-tv-on-demand-or-heard-on-radio/complaint-decisions/
# Data type: case_law
# Auth: none
# License: PSI Licence / CC BY 4.0 (Irish public sector information)
#
# Coimisiún na Meán is the statutory media regulator of Ireland (Online Safety
# and Media Regulation Act 2022, succeeding the Broadcasting Authority of
# Ireland on 15 March 2023). It adjudicates public complaints about content on
# broadcasters and audiovisual on-demand media services under the Broadcasting
# Act 2009 (as amended) and associated media service codes. Each complaint
# decision (Commission's determination and any Authorised Person's investigation
# decision) is published in full = quasi-judicial case_law.
#
# Total: ~205 complaint decisions (2023-present + carried-over transitional
# complaints from the Broadcasting Authority of Ireland).
#
# Access:
#   - Server-rendered listing, 100 decision "cards" per page:
#       .../complaint-decisions/            (page 1)
#       .../complaint-decisions/page/N/     (subsequent pages)
#   - Each card: <h3>CAS-NNNNN</h3> + <dl class="row"> of dt/dd field pairs
#     (Programme, Service, Broadcast date, Statute/code, Short description,
#      Outcome, Commission Decision + date, Authorised Person's Decision + date).
#   - Born-digital HTML — no OCR/PDF extraction required.

