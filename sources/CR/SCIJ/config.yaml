# ===================================================================
# CR/SCIJ -- Costa Rica Sistema Costarricense de Información Jurídica
# ===================================================================
# Costa Rica's official legal information system operated by the
# Procuraduría General de la República (Attorney General).
# Contains all legislation from 1821 to present: Constitution,
# laws, decrees, treaties, regulations, municipal agreements, etc.
#
# URL: https://sinalevi.go.cr/  (migrated off pgrweb.go.cr/scij, issue #1455)
# Access: JSON XHR endpoints keyed by the same numeric norm ID.
# No auth, no session required.
# ===================================================================

source:
  id: "CR/SCIJ"
  country: "CR"
  name: "SCIJ - Sistema Costarricense de Información Jurídica"
  url: "https://sinalevi.go.cr/"
  description: |
    Costa Rica Juridical Information System from the Attorney General.
    Full text of all legislation organized by type: Constitution,
    international treaties, laws, executive decrees, regulations,
    municipal agreements, resolutions, directives, circulars.
    ~70,000-90,000 norms from 1821 to present.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  # The XHR endpoints answer in ~0.2s; three per document (probe, ficha, text)
  # means ~1 doc/s, which finishes the ~100K-norm walk inside one fleet slot.
  # bootstrap-fast layers an AdaptiveRateLimiter on top and backs off on 429.
  requests_per_second: 3
  burst: 5
  max_workers: 4

api:
  type: "id_enumerate"
  base_url: "https://sinalevi.go.cr"
  # version=-1 resolves a norm's live version; the redirect it returns carries
  # param2 = that version id, or 0 when no norm sits behind the ID.
  probe_endpoint: "https://sinalevi.go.cr/ResultadosNormativa/_CargarTextoCompleto"
  fulltext_endpoint: "https://sinalevi.go.cr/ResultadosNormativa/_CargarTextoCompleto"
  metadata_endpoint: "https://sinalevi.go.cr/ResultadosNormativa/_CargarFicha"
  document_url: "https://sinalevi.go.cr/ResultadosNormativa/Informacion?param1={id}&param2={version}&param3=1"
  method: "POST"
  id_range: [1, 107600]   # ceiling re-probed at runtime; do not rely on this
  invalid_response: "JSON redirect with param2=0"

data_model:
  type: "legislation"
  primary_key: "norm_id"
  update_strategy: "upsert"
  dedup_key:
    - "norm_id"

schema:
  key_fields:
    - name: "norm_id"
      description: "SCIJ internal numeric ID"
      type: "integer"
      role: "primary_key"
    - name: "norm_type"
      description: "Type of norm (Ley, Decreto Ejecutivo, Tratados, etc.)"
      type: "string"
      role: "category"
    - name: "norm_number"
      description: "Official number of the norm"
      type: "string"
      role: "identifier"
    - name: "title"
      description: "Official title of the norm"
      type: "string"
      role: "content"
    - name: "text"
      description: "Full text of the legislation"
      type: "string"
      role: "content"
    - name: "date"
      description: "Date of vigencia (effectiveness)"
      type: "date"
      role: "temporal_key"
    - name: "issuing_body"
      description: "Ente emisor (issuing body)"
      type: "string"
      role: "metadata"
      required: false
    - name: "url"
      description: "URL to full text on SCIJ"
      type: "string"
      role: "reference"

notes: |
  - No API or sitemap: enumerate the numeric norm ID space
  - IDs with no norm behind them resolve to version 0 (skip them)
  - Full text is Word-exported HTML returned as JSON by _CargarTextoCompleto
  - _CargarFicha returns the metadata card (type, number, date, issuing body)
  - IDs walked are checkpointed to data/scij_checkpoint.json so a torn-down
    fleet slot resumes instead of restarting at ID 1 (issue #1455)
  - Language: Spanish
  - ~70,000-90,000 valid norms estimated
