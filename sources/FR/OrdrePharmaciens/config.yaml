source:
  id: FR/OrdrePharmaciens
  name: "Ordre des Pharmaciens — Jurisprudence disciplinaire"
  country: FR
  url: https://www.ordre.pharmacien.fr/l-ordre/jurisprudence
  auth: none
  data_types:
  - case_law

endpoints:
  base_url: https://www.ordre.pharmacien.fr
  jurisprudence_page: https://www.ordre.pharmacien.fr/l-ordre/jurisprudence
  pdf_base: https://www.ordre.pharmacien.fr/mediatheque/fichiers/jurisprudence/

rate_limit:
  delay_between_requests: 1.2
  requests_per_second: 0.83

schema:
  required_fields:
  - _id
  - _source
  - _type
  - _fetched_at
  - title
  - text
  - url
  key_fields:
  - name: _id
    required: true
    type: string
  - name: date
    required: false
    type: date

license:
  name: "Custom terms (public anonymised jurisprudence)"
  url: "https://www.ordre.pharmacien.fr/mentions-legales"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Public anonymised disciplinary decisions of an ordinal body with a public service mission. No explicit open-data reuse licence declared; treated as public jurisprudence (comparable to French court decisions)."

notes: >
  Disciplinary jurisprudence of the French National Order of Pharmacists
  (Conseil National de l'Ordre des Pharmaciens, CNOP). The listing at
  ordre.pharmacien.fr/l-ordre/jurisprudence is a Symfony POST-search form
  (CSRF token); an empty keyword returns the full corpus, 15 per page,
  paginated via ?page=N. Each detail page /jurisprudence/{id}-{slug} carries a
  structured summary, the relevant CSP code articles, keywords, a chronology
  table (decision date, plaignant, jurisdiction level) and one or more links to
  the full anonymised decision PDF(s) under /mediatheque/fichiers/jurisprudence/.
  Full text is extracted from all decision PDFs with pdfplumber (per-page cache
  flush). Covers the chambres de discipline de première instance (central /
  regional councils), the chambre de discipline du Conseil national (appeal),
  the sections des assurances sociales, and reproduced Conseil d'État cassation
  decisions. ~100 decisions; records de-duplicated by jurisprudence page id.
