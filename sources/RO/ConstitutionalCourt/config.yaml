source:
  id: "RO/ConstitutionalCourt"
  country: "RO"
  name: "Curtea Constituțională a României"
  url: "https://www.ccr.ro"
  description: |
    Romanian Constitutional Court decisions published as PDFs.
    Coverage: 1992-present. Language: Romanian.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3
  max_workers: 2

api:
  type: "html_scrape"
  base_url: "https://www.ccr.ro"

data_model:
  type: "case_law"
  source_nature: "gazette"
  primary_key: "decision_id"
  update_strategy: "append_only"
  versioning: "none"
  dedup_key:
    - "_id"

schema:
  total_fields: null
  key_fields:
    - name: "id"
      description: "Decision number"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Decision title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Date of decision"
      type: "date"
      role: "temporal_key"
      required: true
  secondary_fields: []
  probably_ignorable: []

license:
  name: "Public Domain (Romanian official acts)"
  url: "https://www.ccr.ro"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Romanian Constitutional Court decisions are official public acts."

notes: |
  - Decisions published as PDFs on ccr.ro
  - PDFs extracted via common/pdf_extract.extract_pdf_markdown
  - No public API, scraping HTML listing pages
  - Listings paginate with `?_page=N` (Content Views plugin). A plain `?page=N`
    is silently ignored and returns the same first slice forever (issue #1534).
  - Listing hrefs end in `#new_tab`, so a `[href$='.pdf']` selector matches
    almost nothing — match with `[href*='.pdf']` and strip the fragment.
  - 1,286 documents across 4 sections (100/38/4/23 pages) as of 2026-09-01
  - Decision date comes from the Romanian title; the upload path /YYYY/MM/ is
    the CMS publication month and lags the decision
  - ccr.ro serves a SHA1 proof-of-work WAF challenge on 503; solved in-process
  - Language: Romanian
  - Coverage: 1992-present
  - Community contribution by @nicoletaMC (PR #51)
