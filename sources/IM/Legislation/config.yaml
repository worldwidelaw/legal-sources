# ===================================================================
# IM/Legislation -- Isle of Man Legislation (Acts of Tynwald)
# ===================================================================
# Consolidated texts of Acts of Tynwald from legislation.gov.im.
# Principal (primary) and Subordinate (secondary) legislation.
# All documents are born-digital PDFs with selectable text.
# No authentication required. No API — enumerated from the com_legislation
# index views (current / repealed / revoked), whose rows link the latest PDF.
# ===================================================================

source:
  id: "IM/Legislation"
  country: "IM"
  name: "Isle of Man Legislation (Acts of Tynwald)"
  url: "https://legislation.gov.im/"
  description: |
    Consolidated legislation of the Isle of Man, including Acts of Tynwald
    (principal legislation) and statutory documents (subordinate legislation).
    Published by the Attorney General's Chambers. PDF files live under
    /cms/images/LEGISLATION/ and are discovered via the site's own index
    views rather than by directory traversal.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_index"
  base_url: "https://legislation.gov.im"
  endpoints:
    current: "/cms/legislation/current.html"        # POST submit4=<A-Z> letter filter
    repealed: "/cms/legislation/repealed.html"
    revoked: "/cms/legislation/revoked-legislation.html"

license:
  name: "Isle of Man Crown Copyright — private use only"
  url: "https://legislation.gov.im/cms/"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >
    Site terms: "Legislation can be downloaded and printed for private use. Any
    commercial entity is required to obtain permission to reuse the data from
    the Isle of Man Attorney General's Chambers."

data_model:
  type: "legislation"
  primary_key: "doc_id"
  update_strategy: "upsert"
  dedup_key:
    - "doc_id"

schema:
  total_fields: 11
  key_fields:
    - name: "doc_id"
      description: "Unique document identifier (e.g., PRINCIPAL/2019-0003)"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Title of the legislation"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the legislation extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Year of enactment"
      type: "string"
      role: "temporal_key"
      required: false
    - name: "url"
      description: "URL to the PDF document"
      type: "string"
      role: "reference"
      required: true
  secondary_fields:
    - name: "leg_type"
      description: "Type: principal or subordinate"
    - name: "year"
      description: "Enactment year"
    - name: "reference"
      description: "Legislative reference number (e.g. 2019-0001)"
    - name: "legislation_status"
      description: "Index the item was found in: current, repealed or revoked"
    - name: "version"
      description: "Consolidation version number of the PDF fetched"
    - name: "language"
      description: "ISO 639-3 language code (always eng)"
