# ===================================================================
# BH/MOLA-Laws -- Bahrain Ministry of Legal Affairs: Consolidated Laws
# ===================================================================
# Consolidated laws and legislative decrees of the Kingdom of Bahrain,
# published bilingually (English + Arabic) by the Ministry of Legal
# Affairs (MoLA). Each law is a PDF with full consolidated text and
# inline notes of subsequent amendments.
# Listing: https://www.mola.gov.bh/EN/Legislation/Laws/
# Grid is populated by POST ?handler=GetLegislations (Razor Pages XHR).
# Text extracted via PyMuPDF.
# ===================================================================

source:
  id: "BH/MOLA-Laws"
  country: "BH"
  name: "Bahrain Ministry of Legal Affairs Consolidated Laws"
  url: "https://www.mola.gov.bh/EN/Legislation/Laws/"
  description: |
    Consolidated laws and legislative decrees of the Kingdom of Bahrain
    published by the Ministry of Legal Affairs (MoLA). Each entry is a
    bilingual (English + Arabic) PDF containing the full consolidated
    text of the law, with amendments noted inline (9 are Arabic-only).
    ~66 laws/decrees. Metadata comes from the site's GetLegislations XHR;
    text extracted with PyMuPDF, repairing decomposed lam-alef ligatures.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 1

api:
  type: "pdf_download"
  base_url: "https://www.mola.gov.bh"
  endpoints:
    listing: "/EN/Legislation/Laws/"
    listing_handler: "/EN/Legislation/Laws/?handler=GetLegislations"
    law_pdf: "/MediaManager/Media/MolaMedia/Documents/{batch}/{file}.pdf"
  pagination:
    type: "page_number"
    params:
      page: "pageNo"
      size: "pageSize"
    note: >-
      POST with the page's __RequestVerificationToken as a
      RequestVerificationToken header. Returns {items, totalRecords};
      pageSize is honoured to at least 500, so the whole corpus fits one page.
      A full browser User-Agent is required (WAF rejects short UAs).

data_model:
  type: "legislation"
  primary_key: "_id"
  update_strategy: "upsert"
  dedup_key:
    - "url"

schema:
  total_fields: 16
  key_fields:
    - name: "_id"
      description: "Unique ID derived from the detail-page slug (BH-MOLA-{slug})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "English title of the law/decree"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full extracted text of the consolidated law (EN+AR)"
      type: "string"
      role: "content"
      required: true
    - name: "law_number"
      description: "Law/decree number"
      type: "string"
      role: "metadata"
      required: false
    - name: "year"
      description: "Year of enactment"
      type: "string"
      role: "metadata"
      required: false
    - name: "gazette_number"
      description: "Official Gazette issue number in which the law was published"
      type: "string"
      role: "metadata"
      required: false
    - name: "status"
      description: "Legal status (e.g. Valid, Repealed)"
      type: "string"
      role: "metadata"
      required: false
    - name: "summary"
      description: "Official abstract of the law from the MoLA listing"
      type: "string"
      role: "content"
      required: false
    - name: "date"
      description: "Publication date reported by the MoLA listing (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "url"
      description: "URL of the law's detail page on mola.gov.bh"
      type: "string"
      role: "reference"
      required: true

license:
  name: "Bahrain Government Open Data"
  url: "https://www.data.gov.bh/en/ODPolicy"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official government legislation published by the Ministry of Legal Affairs, open access"
