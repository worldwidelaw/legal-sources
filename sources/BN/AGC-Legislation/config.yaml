source:
  id: BN/AGC-Legislation
  name: Brunei Attorney Generals Chambers Legislation
  country: BN
  url: https://www.agc.gov.bn/AGC%20Site%20Pages/Laws%20of%20Brunei.aspx
  description: >
    The Attorney General's Chambers legislation archive tree that the "Laws of
    Brunei" index page never linked: alphabetical revised editions (incl. historical
    1984/2001/2002 revisions and repeal-replacement notices), Brunei Laws Updating
    Volume orders, historical enactments 1908-1975, subsidiary orders, and the
    Cap. 157 statutes/regulations. ~708 PDFs. The index-page corpus itself is
    covered by BN/AGCLaws. Inventory enumerated from the Internet Archive CDX
    index; PDFs downloaded live from agc.gov.bn.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: chapter
      type: string
      required: false
    - name: pdf_url
      type: string
      required: false
    - name: collection
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly
