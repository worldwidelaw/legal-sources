# ===================================================================
# SE/ARN -- Allmänna reklamationsnämnden, vägledande beslut
# ===================================================================
# Swedish state consumer ADR body. One server-rendered index page lists
# every guiding decision (referat) with its category, decision date and
# editorial summary, linking to a born-digital PDF of the full referat.
# ===================================================================

source:
  id: "SE/ARN"
  country: "SE"
  name: "Sweden — Allmänna reklamationsnämnden (National Board for Consumer Complaints), vägledande beslut"
  url: "https://www.arn.se/om-arn/vagledande-beslut/"
  description: |
    Allmänna reklamationsnämnden is the Swedish state alternative-dispute-
    resolution body for consumer disputes. It hears roughly 10,000 cases a
    year and issues recommendations that traders follow in the large
    majority of cases.

    Only the vägledande (guiding) decisions — the referat the Board itself
    selects as precedent — are published, so the ~137 documents collected
    here are the full public corpus rather than a sample of it. Coverage
    runs from 2017 to the present, across the Board's subject divisions
    (Allmänna, Bank, Bostad, Elektronik, Försäkring, Motor, Resor, Tvätt…).
    Language: Swedish.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 4

api:
  type: "html_scrape"
  base_url: "https://www.arn.se"
  endpoints:
    list: "/om-arn/vagledande-beslut/"
  notes: |
    The index is a single server-rendered page — no API, no pagination, no
    JavaScript. It is a sequence of blocks:

      <h3>{Ärendeområde}, beslut {YYYY-MM-DD}</h3>
      <p>… editorial summary …</p>
      <p><a href="/globalassets/…/referat-{YYYY}/…pdf">Referat {caseno}</a></p>

    The folder year in the PDF path is the year of PUBLICATION, not of the
    decision (referat-2019/ holds 2018 case numbers), so the date is taken
    from the heading, or from the PDF's own "Beslut YYYY-MM-DD; {caseno}"
    line, never from the URL.

schema:
  key_fields:
    - name: "_id"
      description: "arn-{case number}, e.g. arn-2017-13781"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "ARN {case number(s)} — {subject division}"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the referat, extracted from the PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Decision date (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: true
    - name: "case_number"
      description: "ARN case number (YYYY-NNNNN); the first when jointly decided"
      type: "string"
      role: "reference"
      required: true
    - name: "case_numbers"
      description: "All case numbers covered by the referat"
      type: "array"
      role: "reference"
      required: true
    - name: "category"
      description: "Subject division (Allmänna, Bank, Bostad, Motor, Resor…)"
      type: "string"
      role: "metadata"
      required: false
    - name: "summary"
      description: "Editorial headnote from the index page"
      type: "string"
      role: "content"
      required: false
    - name: "url"
      description: "Direct URL to the referat PDF on arn.se"
      type: "string"
      role: "reference"
      required: true

license:
  name: "Public Domain (Government) — 9 § URL"
  url: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1960729-om-upphovsratt-till-litterara-och_sfs-1960-729/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: |
    Decisions of a Swedish public authority are excluded from copyright by
    9 § of the Swedish Copyright Act (lag 1960:729 om upphovsrätt till
    litterära och konstnärliga verk), which places "beslut av myndighet"
    outside copyright protection.

notes: |
  - Single server-rendered index page; no API, no auth, no captcha, no geo-block.
  - ~137 referat, the full published corpus (ARN publishes only guiding decisions).
  - Two referat cover jointly decided pairs and carry both case numbers.
  - Referat published from ~2019 on carry an upside-down page-footer stamp that
    the PDF extractor reads back-to-front; those lines are stripped from the text
    and the reversed date serves as a date fallback.
