data:
  coverage:
    notes: Domstolsverket open-data API (rattspraxis.etjanst.domstol.se), ~1,300 HFD
      publications. Full text comes from the HTML 'innehall' field, falling back to
      the PDF attachment and then the summary.
    start_year: 2008
  endpoints:
    attachment: https://rattspraxis.etjanst.domstol.se/api/v1/bilagor/{fillagringId}
    openapi: https://rattspraxis.etjanst.domstol.se/openapi/puh-openapi.yaml
    publications: https://rattspraxis.etjanst.domstol.se/api/v1/publiceringar?domstolkod=HFD
    web: https://rattspraxis.etjanst.domstol.se/sok/?id={id}
  format: json
fetcher:
  batch_size: 20
  rate_limit: 2
  update_schedule: daily
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: case_number
    required: false
    type: string
  - name: date
    required: false
    type: date
  metadata_fields:
  - document_type
  - publication_type
  - publication_type_label
  - is_precedent
  - keywords
  - legal_provisions
  - sfs_numbers
  - summary
  - court
  - court_code
  - case_numbers
  - text_source
  - pdf_filename
  required_fields:
  - text
  - title
  - case_number
source:
  country: SE
  court: Högsta förvaltningsdomstolen
  court_code: HFD
  id: SE/SupremeAdministrativeCourt
  language: sv
  license: public_domain
  name: Swedish Supreme Administrative Court (Högsta förvaltningsdomstolen)
  type: caselaw
  url: https://www.domstol.se/hogsta-forvaltningsdomstolen/avgoranden/
