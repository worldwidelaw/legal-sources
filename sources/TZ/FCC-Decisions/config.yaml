source_id: TZ/FCC-Decisions
name: "Fair Competition Commission — Decisions"
country: TZ
url: https://www.fcc.go.tz/
data_types:
  - case_law
  - doctrine

schema:
  key_fields:
    - name: "_id"
      type: "string"
      required: true
    - name: "title"
      type: "string"
      required: true
    - name: "text"
      type: "string"
      required: true
    - name: "date"
      type: "date"
      required: false
    - name: "category"
      type: "string"
      required: false

rate_limit:
  requests_per_second: 1
  burst: 2
  max_workers: 4

license:
  name: "Open Government Data (Tanzania)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government competition authority decisions, published via public API"
