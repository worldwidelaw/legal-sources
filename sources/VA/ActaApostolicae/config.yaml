fetch:
  base_url: https://www.vatican.va
  delay_seconds: 1
  method: AEM/Sling JSON API (append .N.json to URL paths)
notes: 'Uses the Adobe Experience Manager / Apache Sling JSON API exposed by vatican.va.

  Covers legislative documents from 7 pontificates (Pius XII through Leo XIV):

  encyclicals, motu proprio, apostolic constitutions, apostolic exhortations,

  apostolic letters, and papal bulls. ~2,100 documents with full text.

  Slugs are enumerated as the union across the en/la/it/es/fr/pt/de site trees
  (a single tree truncates: Paul VI apostolic letters are 229 under /en/ but
  325 under /la/), and each document is fetched across the same language chain
  until a version carries a body — many acts, notably the ~640 John Paul II and
  ~356 Paul VI diocese-erection constitutions, are marked isemptybody in English
  and only published in Latin.

  Full runs stream to data/records.jsonl and checkpoint every 50 documents to
  data/checkpoint.json, so a restart resumes without refetching.

  '
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: _source
    required: false
    type: string
  - name: _type
    required: false
    type: string
  - name: title
    required: true
    type: string
  - name: text
    required: true
    type: string
  - name: date
    required: false
    type: date
  - name: url
    required: true
    type: string
  - name: pope
    required: false
    type: string
  - name: document_type
    required: false
    type: string
source:
  auth: none
  country: VA
  data_types:
  - legislation
  id: VA/ActaApostolicae
  license: Holy See / Vatican
  name: Vatican Apostolic Documents
  url: https://www.vatican.va/
