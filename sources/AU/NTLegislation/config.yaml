# ===================================================================
# AU/NTLegislation -- Northern Territory Legislation
# ===================================================================
# Northern Territory Acts and subordinate legislation from the
# official register at legislation.nt.gov.au (Sitecore CMS).
#
# Discovery: Browse listing at /en/LegislationPortal/Acts/By-Title
# Full text: PDF download via /api/sitecore/Act/PDF?id={NUMERIC_ID}
# Format: PDF extracted via PyMuPDF (fallback: pdfplumber, then pypdf)
# License: Crown copyright, free public access (non-official reproduction OK)
# ===================================================================

source:
  id: "AU/NTLegislation"
  country: "AU"
  name: "Northern Territory Legislation (legislation.nt.gov.au)"
  url: "https://legislation.nt.gov.au/"
  description: |
    Northern Territory in-force Acts and subordinate legislation.
    Full text downloaded as PDF from the official legislation register.
    Covers ~385 Acts and ~304 subordinate laws.

data_types:
  - legislation

auth:
  type: "none"

license:
  name: "Northern Territory legislation copyright policy"
  url: "https://legislation.nt.gov.au/en/Footer/Terms-of-Use"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Crown copyright owned by the Northern Territory, which grants blanket
    permission to republish NT legislation provided the publication does not
    indicate it is an official version, does not use the arms of the Northern
    Territory, and reproduces the material accurately without misleading.
    Permission is revocable on reasonable notice. Not a Creative Commons licence.

rate_limit:
  # Each document costs two requests (page + on-demand PDF render, ~3-20 s),
  # so throughput is bound by max_workers, not by the submit rate.
  requests_per_second: 1.0
  burst: 3
  max_workers: 5

api:
  type: "pdf_download"
  base_url: "https://legislation.nt.gov.au"
  browse_acts: "/en/LegislationPortal/Acts/By-Title"
  browse_sl: "/en/LegislationPortal/Subordinate-Legislation/By-Title"
  pdf_pattern: "/api/sitecore/Act/PDF?id={NUMERIC_ID}"

data_model:
  type: "legislation"
  primary_key: "slug"
  update_strategy: "upsert"
  dedup_key:
    - "slug"

schema:
  total_fields: 12
  key_fields:
    - name: "slug"
      description: "Document slug from URL (e.g., CRIMINAL-CODE-ACT-1983)"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Act or regulation title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the legislation"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Assent or gazette date"
      type: "string"
      role: "temporal_key"
      required: false
    - name: "url"
      description: "URL to original legislation page"
      type: "string"
      role: "reference"
      required: true

notes: |
  - PDF full text via /api/sitecore/Act/PDF?id={NUMERIC_ID}
  - Browse listing at /en/LegislationPortal/Acts/By-Title and /Subordinate-Legislation/By-Title
  - PDFs are rendered on demand with no server-side cache, so the download
    happens in normalize() and bootstrap-fast overlaps it across 5 workers
  - Every request runs under a wall-clock deadline (issue #1383); a run that
    stalls can be resumed from data/records.jsonl
  - Crown copyright, free public access
  - ~385 Acts + ~304 subordinate legislation = ~689 documents
