# ===================================================================
# KY/Legislation -- Cayman Islands Legislation (legislation.gov.ky)
# ===================================================================
# Official consolidated laws from the Cayman Islands Law Revision
# Commissioner: principal Acts, subordinate legislation and amending
# instruments, every revision of each item, 1961-present.
#
# Discovery: CMS index pages -- /cms/legislation/current/by-title.html
#            POSTed once per letter A-Z (submit4 alphabet filter), plus the
#            repealed / revoked / not-in-force listings. The old Apache
#            directory listings under /cms/images/LEGISLATION/ now return an
#            empty index and can no longer be crawled.
# Full text: PDF download, extracted via pdfplumber/pypdf
# License: Free public access
# ===================================================================

source:
  id: "KY/Legislation"
  country: "KY"
  name: "Cayman Islands Legislation"
  url: "https://legislation.gov.ky/cms/"
  description: |
    Official consolidated laws of the Cayman Islands, maintained by the
    Office of the Law Revision Commissioner. Includes principal acts and
    subordinate legislation (regulations, orders). Full text extracted
    from PDF. Covers 1961-present.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 2

api:
  type: "html_index"
  base_url: "https://legislation.gov.ky"
  by_title_path: "/cms/legislation/current/by-title.html"
  alphabet_param: "submit4"
  static_index_paths:
    - "/cms/legislation/repealed.html"
    - "/cms/legislation/revoked-secondary-legislation.html"
    - "/cms/legislation/not-in-force-menu.html"

data_model:
  type: "legislation"
  primary_key: "_id"
  update_strategy: "upsert"
  dedup_key:
    - "_id"

schema:
  total_fields: 12
  key_fields:
    - name: "_id"
      description: "KY/Legislation/{CATEGORY}/{item}/{version-slug}"
      type: "string"
      role: "primary_key"
      required: true
    - name: "legislation_id"
      description: "Legislation item number (e.g., 1961-0003)"
      type: "string"
      role: "reference"
      required: true
    - name: "legislation_type"
      description: "principal | subordinate | amending"
      type: "string"
      role: "category"
      required: true
    - name: "version"
      description: "Revision label (e.g., '2026 Revision', 'Act 6 of 2016')"
      type: "string"
      role: "content"
      required: false
    - name: "title"
      description: "Act or regulation title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the legislation"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Revision/enactment year as ISO date (YYYY-01-01)"
      type: "string"
      role: "temporal_key"
      required: true
    - name: "url"
      description: "URL to PDF download"
      type: "string"
      role: "reference"
      required: true

notes: |
  - ~1,764 PDFs discovered: principal Acts, subordinate legislation, amending
    instruments, plus repealed/revoked/not-in-force items
  - Every revision of an item is a separate record (Companies Act alone has
    ~20 revisions from 1995 to 2026)
  - Crawl order is newest-revision-first across items, principal Acts ahead of
    subordinate and amending, so a truncated run stays broad
  - The `_g.pdf` twins are the gazette-typeset reprint of the same text and are
    skipped as duplicates
  - A handful of pre-1995 amending instruments are scanned images and need OCR
