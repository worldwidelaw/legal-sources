country: CZ
data_types:
- legislation
endpoints:
  sparql: https://opendata.eselpoint.gov.cz/sparql
  portal: https://www.e-sbirka.cz
  info_portal: https://zakony.gov.cz
fetcher:
  max_retries: 3
  rate_limit_ms: 1000
  ssl_verify: false
  timeout_s: 120
language: cs
license:
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: ''
name: e-Sbírka - Czech Collection of Laws
notes: 'e-Sbírka is the official Czech electronic collection of laws, launched in January
  2024.

  The open data SPARQL endpoint provides access to 92,000+ legal acts with full text.

  Data is updated daily.


  The SPARQL approach fetches acts fragment-by-fragment with zero bulk downloads,

  avoiding the OOM issues of the old bulk JSON approach.


  RDF vocabulary uses the https://slovník.gov.cz/datový/sbírka/pojem/ prefix.

  Acts -> versions (má-poslední-znění) -> ordered fragments -> text.

  '
schema:
  date_format: ISO8601
  key_fields:
  - name: _id
    required: true
    type: string
  - name: title
    required: true
    type: string
  - name: citation
    required: true
    type: string
  - name: year
    required: true
    type: integer
  - name: number
    required: true
    type: integer
  - name: eli_uri
    required: true
    type: string
  - name: url
    required: true
    type: string
  - name: date
    required: false
    type: string
  text_field: text
source_id: CZ/eSbirka
