auth:
  type: none
data:
  api_type: sparql
  format: rdf
  types:
  - legislation
  update_frequency: daily
license:
  name: Open Government Data
  url: https://www.admin.ch/gov/en/start/terms-and-conditions.html
notes: 'Swiss Federal Legislation via Fedlex SPARQL endpoint.

  Classified Compilation (SR/RS) is emitted one record per ARTICLE so that

  citations such as "OR Art. 814" / "ZGB Art. 14" resolve to one document

  (issue #1615); Federal Gazette acts are emitted whole.

  Uses JOLux ontology (FRBR-based) with ELI URIs.

  Available formats: HTML, XML, PDF, DOCX.

  Coverage: Official Compilation (OC), Official Federal Gazette (FGA),

  Classified Compilation (CC).

  Languages: DE, FR, IT, RM (Romansh).

  '
rate_limit:
  delay_between_requests: 0.5
  requests_per_second: 2
schema:
  key_fields:
  - name: sr_number
    required: false
    type: string
  - name: abbreviation
    required: false
    type: string
  - name: article
    required: false
    type: string
  - name: act_title
    required: false
    type: string
  - name: corpus
    required: false
    type: string
  - name: eli_uri
    required: false
    type: string
  - name: title
    required: true
    type: string
  - name: date
    required: false
    type: string
  - name: consolidation_date
    required: false
    type: string
  - name: language
    required: false
    type: string
  - name: url
    required: false
    type: string
  - name: file_url
    required: false
    type: string
  - name: text
    required: true
    type: string
source:
  country: CH
  id: CH/Fedlex
  name: Fedlex - Swiss Federal Legislation
  url: https://fedlex.data.admin.ch
