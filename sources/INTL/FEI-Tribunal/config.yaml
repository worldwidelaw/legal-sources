source:
  auth: none
  country: INTL
  data_types:
  - case_law
  description: >
    FEI Tribunal decisions — the published full-text rulings of the independent
    judicial body of the Fédération Équestre Internationale (FEI), the world
    governing body for equestrian sport. Covers equine and human anti-doping
    cases, controlled-medication and prohibited-substance cases, consent awards,
    horse-abuse and other disciplinary matters, appeals against Ground Jury
    decisions, and CAS awards in FEI-related appeals. Each case is published as a
    full redacted decision PDF (the substantive findings, sanction, period of
    ineligibility, fines and full legal reasoning), organised by category and
    year on inside.fei.org. Openly published for transparency (no login); the
    WAF rejects some datacenter IPs.
