source:
  auth: none
  country: INTL
  data_types:
  - case_law
  description: >
    World Rugby disciplinary & judicial decisions — the published full-text
    rulings of World Rugby's independent disciplinary process. Covers Judicial
    Committee / Judicial Officer decisions, Disciplinary Committee decisions,
    Foul Play Review Committee (FPRC) decisions, anti-doping decisions, appeal
    decisions, and CAS awards rendered on appeal, including Rugby World Cup and
    international-window matters. Each adjudicated case is published as a full
    redacted written decision PDF (the panel's findings, reasoning, sanction and
    period of suspension). The decisions hub server-renders direct links to
    every decision PDF; no login or WAF.
