  description: >
    Aquatics Integrity Unit (AQIU) decisions — the independent integrity body of
    World Aquatics (formerly FINA) that investigates and adjudicates anti-doping,
    integrity-code, safeguarding and competition-manipulation matters across the
    aquatic disciplines (swimming, water polo, diving, artistic swimming, open
    water, high diving). Two openly published full-text corpora on
    aquaticsintegrity.com: (1) born-digital, multi-page reasoned
    Adjudicatory-Body / Doping-Panel decision PDFs linked from the Suspended
    Persons registry, and (2) official sanction-decision news notices carrying
    the respondent, the rule(s) violated, the sanction and the ineligibility
    period. Public WordPress site, no login, no WAF, reachable from any IP.
