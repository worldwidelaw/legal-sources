  description: >
    UCI Anti-Doping Tribunal decisions and CAS appeal awards. The UCI Anti-Doping
    Tribunal (Tribunal Antidopage de l'UCI) is the independent first-instance body
    that hears anti-doping rule violation cases in international cycling under the
    UCI Anti-Doping Rules and the World Anti-Doping Code. The UCI publishes, in
    full, the reasoned tribunal judgments and the Court of Arbitration for Sport
    (CAS) awards rendered on appeal against them. The "UCI Anti-Doping Tribunal"
    page on uci.org is a Contentful-backed page whose rich-text body — including a
    link to every decision PDF — is server-embedded in the HTML as a
    unicode-escaped JSON island; each decision is a full reasoned PDF hosted openly
    on assets.ctfassets.net (no login, no WAF, reachable from any IP).
