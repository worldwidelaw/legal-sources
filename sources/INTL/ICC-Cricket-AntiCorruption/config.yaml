  data_types:
  - case_law
  description: >
    ICC (International Cricket Council) Anti-Corruption decisions — the published
    full-text rulings issued under the ICC's Anti-Corruption Code for
    Participants. When the ICC Anti-Corruption Tribunal, a sole adjudicator or an
    appeal panel determines a charge brought by the ICC Integrity Unit against a
    player, official or other participant (match-fixing, spot-fixing, failure to
    report a corrupt approach, etc.), the ICC publishes the full redacted
    decision — findings on liability, sanction, period of ineligibility, and full
    legal reasoning — as a PDF on its "ACU publications" page (~38 named-matter
    decisions, reverse-chronological). This is the cricket world governing body,
    NOT the International Criminal Court (INTL/ICCCaseLaw) nor ICC arbitration
    (INTL/JusMundi-ICC). Openly published (no login, no WAF), reachable from any
    IP; a small minority of legacy PDFs on resources.pulse.icc-cricket.com may be
    unavailable and are skipped.
