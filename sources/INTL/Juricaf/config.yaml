source:
  id: INTL/Juricaf
  name: "Juricaf Francophone Supreme Court Decisions"
  url: https://juricaf.org
  country: INTL
  data_types:
    - case_law
  description: >
    ~1.86M supreme court decisions from 48 francophone countries and
    international courts. Operated by AHJUCAF (Association of Francophone
    Supreme Judicial Courts). Covers France, Belgium, Luxembourg, Switzerland,
    Canada, Monaco, Senegal, Madagascar, Benin, Mali, Niger, Cameroon,
    Burkina Faso, Togo, Chad, Congo, DR Congo, Côte d'Ivoire, Guinea,
    Morocco, Mauritania, Burundi, Comoros, Haiti, Lebanon, plus OHADA,
    UEMOA, CEMAC, ECOWAS, ECHR, CJEU courts.

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

data_model:
  type: "case_law"
  primary_key: "_id"
  # Keyed on _id (juricaf-{slug}) rather than the default whole-record hash:
  # that hash covers _fetched_at, so every run looked new and a resumed run
  # could never tell which decisions it had already stored.
  dedup_key:
    - _id
  update_strategy: "upsert"

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: url
      type: string
      required: true
    - name: court
      type: string
      required: false
    - name: country_origin
      type: string
      required: false
    - name: case_number
      type: string
      required: false

license:
  name: "Public domain (government judicial decisions)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Government judicial decisions from supreme/cassation courts. AHJUCAF project with OIF support."
