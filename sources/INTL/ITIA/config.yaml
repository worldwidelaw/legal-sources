source:
  auth: none
  country: INTL
  data_types:
  - case_law
  description: >
    International Tennis Integrity Agency (ITIA) published sanctions and
    disciplinary decisions — the independent body safeguarding professional
    tennis worldwide, administering the Tennis Anti-Corruption Program (TACP)
    and the Tennis Anti-Doping Programme (TADP). Each published article carries
    the full substantive findings (breaches, sanction, period of ineligibility,
    fines, reasoning summary) of an Anti-Corruption Hearing Officer / Independent
    Tribunal decision or agreed sanction; tribunal cases also link the full
    redacted decision PDF. Openly published on itia.tennis (no login, no WAF).
  id: INTL/ITIA
  language: en
  name: International Tennis Integrity Agency (ITIA) Sanctions & Decisions
  url: https://www.itia.tennis/news/sanctions/
