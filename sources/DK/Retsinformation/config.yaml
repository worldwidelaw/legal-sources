# ===================================================================
# DK/Retsinformation -- Denmark Official Law Database
# ===================================================================
# Sitemap discovery (192K+ docs) + ELI XML for full text.
# Updates: harvest API (api.retsinformation.dk/v1/Documents, 1 req/10s, 03:00-23:45)
# Bootstrap: sitemap pages → ELI /xml endpoint (2s gap).
# ===================================================================

source:
  id: "DK/Retsinformation"
  country: "DK"
  name: "Denmark Retsinformation (Official Law Database)"
  url: "https://www.retsinformation.dk/"
  description: |
    Official Danish legal information system. Harvest API provides
    daily document updates with XML full text via ELI URIs.
    Covers statutes, executive orders, circulars from 1985 onwards.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 12
  burst: 24
  max_workers: 8
  notes: >
    Two hosts, two limits. The documented 1 req/10 sec applies only to the
    harvest API (api.retsinformation.dk/v1/Documents, available 03:00-23:45
    Danish time) and is enforced separately in bootstrap.py. The crawl host
    retsinformation.dk (sitemap + ELI /xml) serves ~20 req/s; this value
    governs BaseScraper's per-record limiter, which previously sat at 0.1
    and capped the whole bootstrap at 0.1 rec/s (issue #1460).

api:
  type: "rest"
  base_url: "https://api.retsinformation.dk"
  endpoints:
    documents: "/v1/Documents"
    xml: "http://retsinformation.dk/eli/accn/{accession}/xml"
  response_format: "json+xml"

data_model:
  type: "legislation"
  primary_key: "accession_number"
  update_strategy: "upsert"

schema:
  total_fields: 10
  key_fields:
    - name: "accession_number"
      description: "Unique accession number (e.g., B20250139505)"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text from XML"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Change/publication date"
      type: "date"
      role: "temporal_key"
      required: true
    - name: "url"
      description: "ELI URI"
      type: "string"
      role: "reference"
      required: true

notes: |
  - Harvest API returns docs changed per day (last 10 days)
  - XML via ELI accession number
  - Language: Danish
  - Rate limit: 1 req / 10 sec
