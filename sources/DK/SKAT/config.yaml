source:
  id: DK/SKAT
  name: Danish Tax Authority (Skattestyrelsen)
  country: DK
  url: https://www.retsinformation.dk
  data_types:
    - doctrine
  description: |
    Danish tax doctrine including binding rulings (bindende svar) and decisions
    from Skatterådet and Skattestyrelsen published on Retsinformation.

auth:
  type: none

rate_limit:
  requests_per_second: 2
  burst: 5
  max_workers: 5
  min_rate: 0.5
  max_rate: 8

api:
  type: rest
  base_url: https://www.retsinformation.dk
  format: xml
  endpoints:
    # Enumeration: dt=230 is the "Afgørelse" (AFG) document type
    search: "/api/documentsearch?ps=100&dt=230&page={page}"
    eli_xml: "{retsinfo_link}/dan/xml"

schema:
  key_fields:
    - name: accession_number
      type: string
      required: true
    - name: document_id
      type: string
      required: false
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: string
      required: false

fetch:
  # Enumerate via the Retsinformation search API instead of blind-scanning the
  # /eli/retsinfo/{year}/{number} number space (issue #1389).
  strategy: search_api
  document_type_id: 230  # AFG - Afgørelser (Decisions/Rulings)
  page_size: 100
  filter_ressort_contains: skatte  # Skatteministeriet / Skatte- og Vækstministeriet
  coverage: 1954-present
