  url: https://www.aragon.es/tacpa
  country: ES
  region: Aragón
  jurisdiction: ES-AR
  data_types:
    - case_law
  auth:
    type: none
  license:
    name: "Gobierno de Aragón open data (PSI reuse)"
    url: "https://opendata.aragon.es/aviso-legal"
    commercial_use: true
    attribution_required: true
    share_alike: false
    no_derivatives: false
    notes: "Reutilización de información del sector público (Ley 37/2007). Acuerdos públicos del tribunal administrativo."

api:
  base_url: https://gd.aragon.es/cgi-bin/ACTA/BRSCGI
  list_cmd: VERLST
  object_cmd: VEROBJ
