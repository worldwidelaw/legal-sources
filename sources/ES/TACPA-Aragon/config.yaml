schema:
  key_fields:
    - name: "_id"
      type: "string"
      required: true
    - name: "title"
      type: "string"
      required: true
    - name: "text"
      type: "string"
      required: true
    - name: "date"
      type: "string"
      required: false
    - name: "resolution_number"
      type: "string"
      required: false
    - name: "type_contract"
      type: "string"
      required: false
    - name: "url"
      type: "string"
      required: false

coverage:
  estimated_records: 1902
  date_range: "2011-present"
  languages:
    - es
  full_text: true
